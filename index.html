    <div class="card">
      <div class="accordion-header" onclick="toggleAccordion('acc_vehicles')">
        <h3>Add Vehicle</h3>
        <span class="accordion-caret" id="acc_vehicles_caret">▾</span>
      </div>
      <div class="accordion-body" id="acc_vehicles_body" style="display:none; margin-top:12px;">
      <div class="form-row">
        <div class="field"><label>Flat No</label>
          <select id="v_flat">${(flats||[]).map(f=>`<option value="${f.flat_no}">${f.flat_no}${f.owner_name?' — '+f.owner_name:''}</option>`).join('')}</select>
        </div>
        <div class="field"><label>Type</label><select id="v_type"><option>Two Wheeler</option><option>Four Wheeler</option></select></div>
        <div class="field"><label>Vehicle Number</label><input id="v_num" placeholder="GJ05XX0000"></div>
        <div class="field"><label>Remarks</label><input id="v_remarks"></div>
        <div class="field" style="flex:0"><button class="primary" onclick="addVehicle()">Add</button></div>
      </div>
      </div>
    </div>`}
    <div class="card">
      <p class="config-note" style="margin-top:-6px">🔍 અહીં ફ્લેટ નંબર અથવા વાહન નંબર નાખીને કોઈપણ ફ્લેટના માલિકનું નામ, મોબાઈલ નંબર અને તેમના વાહનની વિગત જોઈ શકાય છે — PIN ની જરૂર નથી.</p>
      <div class="form-row">
        <div class="field"><input id="v_search" class="search-safe" placeholder="Vehicle No / Flat No"></div>
      </div>
      <p class="config-note" style="text-align:center; margin-top:2px;">📋 નંબર પર દબાવી રાખો તો કૉપિ થઈ જશે</p>
      ${error?`<div class="msg error">${friendlyDbError(error)}</div>`:''}
      <div id="vehicles-results-wrap"></div>
    </div>`;
  document.getElementById('v_search').addEventListener('input', filterVehicleResults);
  filterVehicleResults();
}
function filterVehicleResults(){
  const raw = (document.getElementById('v_search')?.value || '').trim().toUpperCase();
  const list = raw
    ? vehiclesCache.filter(v =>
        (v.vehicle_number||'').toUpperCase().includes(raw) ||
        String(v.flat_no).includes(raw))
    : vehiclesCache;
  const wrap = document.getElementById('vehicles-results-wrap');
  if(!wrap) return;
  // group by flat so the same owner/mobile isn't repeated once per vehicle
  const byFlat = {};
  list.forEach(v=>{
    if(!byFlat[v.flat_no]) byFlat[v.flat_no] = { flat_no:v.flat_no, owner_name:v.owner_name, mobile_no:v.mobile_no, vehicles:[] };
    byFlat[v.flat_no].vehicles.push(v);
  });
  const groups = Object.values(byFlat).sort((a,b)=>a.flat_no-b.flat_no);
  wrap.innerHTML = groups.length ? groups.map(g=>`
    <div class="card floor-card" style="text-align:center;">
      <span class="pill flat-chip" style="background:${flatBadgeColor(g.flat_no)}; font-size:22px; padding:6px 22px;">${g.flat_no}</span>
      <h3 style="margin-top:8px;">${g.owner_name || '<span class="config-note" style="margin:0">કોઈ માલિક નથી</span>'}</h3>
      ${g.mobile_no ? `<p class="mono" ${copyableNumberAttrs(g.mobile_no, 'margin-top:-6px; font-size:19px; font-weight:800; color:var(--maroon); letter-spacing:.02em; display:inline-block;')}>📞 ${g.mobile_no}</p>` : ''}
      ${g.vehicles.map(v=>`<div class="flat-entry">
          <img src="${v.vehicle_type==='Two Wheeler'?ICON_BIKE:ICON_CAR}" alt="" style="height:20px;">
          <span class="mono vnum ${v.vehicle_type==='Two Wheeler'?'type-two':'type-four'}" style="font-size:13.5px;">${fmtVehicleNumber(v.vehicle_number)}</span>
          ${v.remarks ? `<span class="pill" style="background:#B45309; color:#fff; border-color:#B45309; font-weight:700; font-size:11px;">⚠ ${v.remarks}</span>` : ''}
          <span style="font-weight:700; font-size:11.5px; color:var(--ink-soft);">સ્ટીકર: <span style="color:${v.sticker_allotted==='Yes' ? '#2E7D4F' : '#A33A2E'};">${v.sticker_allotted}</span></span>
          <span class="flat-actions">
            <button class="danger" onclick="deleteRow('vehicles','id',${v.id})" title="Delete">🗑️</button>
          </span>
        </div>`).join('')}
    </div>`).join('') : `<div class="card"><p class="empty">કોઈ વાહન મળ્યું નથી.</p></div>`;
}
async function addVehicle(){
  await withPin(async ()=>{
    const payload = {
      flat_no: Number(document.getElementById('v_flat').value),
      vehicle_type: document.getElementById('v_type').value,
      vehicle_number: document.getElementById('v_num').value.toUpperCase().trim(),
      remarks: document.getElementById('v_remarks').value || null,
    };
    const {error} = await sb.from('vehicles').insert(payload);
    if(error) alert(friendlyDbError(error)); else refreshTab();
  });
}

/* ---- Charges tab ---- */
let chargeRoundsCache = [];
let editingChargeRoundName = null;
async function renderChargesTab(box){
  // Same reason as editingExpenseId in renderExpensesTab: a fresh render
  // of this tab always starts a clean "Add Charge Round" — leaving an
  // edit half-done and switching tabs must not leave a stale round name
  // armed, or the next Save could rename/reassign a DIFFERENT round's
  // collections onto whatever gets typed in next.
  editingChargeRoundName = null;
  const {data, error} = await sb.from('charges').select('*').order('date_started',{ascending:false});
  chargeRoundsCache = data || [];
  box.innerHTML = `
    <div class="card">
      <div class="accordion-header" onclick="toggleAccordion('acc_charges')">
        <h3 id="charges-form-title">Add Charge Round</h3>
        <span class="accordion-caret" id="acc_charges_caret">▾</span>
      </div>
      <div class="accordion-body" id="acc_charges_body" style="display:none; margin-top:12px;">
      <div class="form-row">
        <div class="field"><label>Round Name</label><input id="ch_name" placeholder="e.g. Diwali Fund"></div>
        <div class="field"><label>Amount per Flat</label><input id="ch_amount" type="number"></div>
        <div class="field"><label>Applies To</label><select id="ch_applies"><option>All Flats</option><option>Sold Flats Only</option><option>Unsold Flats Only</option></select></div>
        <div class="field"><label>Date Started</label><input id="ch_date" type="date"></div>
        <div class="field" style="flex:0"><button class="primary" onclick="addCharge()">Save</button></div>
        <div class="field" style="flex:0"><button onclick="resetChargeForm()">Clear</button></div>
      </div>
      ${error?`<div class="msg error">${friendlyDbError(error)}</div>`:''}
      </div>
    </div>
    ${data && data.length ? data.map(c=>`
    <div class="card" style="text-align:center;">
      <h3 style="margin-bottom:2px;">${c.round_name}</h3>
      <div class="mono" style="font-size:26px; font-weight:800; color:var(--maroon);">${fmtMoney(c.amount_per_flat)}</div>
      <p class="config-note" style="margin-top:2px;">ફ્લેટ દીઠ</p>
      <div style="display:flex; justify-content:center; align-items:center; gap:8px; flex-wrap:wrap; margin-top:10px;">
        <span class="pill ${c.applies_to==='All Flats'?'unsold':'sold'}">${c.applies_to}</span>
        <span class="config-note mono" style="margin:0;">શરૂઆત ${fmtDate(c.date_started)}</span>
      </div>
      <div style="display:flex; justify-content:center; gap:8px; margin-top:12px;">
        <button onclick="editCharge('${c.round_name}')">Edit</button>
        <button class="danger" onclick="deleteRow('charges','round_name','${c.round_name}',true)" title="Delete">🗑️</button>
      </div>
    </div>`).join('') : `<div class="card"><p class="empty">હજુ કોઈ ચાર્જ રાઉન્ડ નથી.</p></div>`}`;
}
function editCharge(roundName){
  const c = chargeRoundsCache.find(x=>x.round_name===roundName);
  if(!c) return;
  openAccordion('acc_charges');
  editingChargeRoundName = roundName;
  document.getElementById('ch_name').value = c.round_name;
  document.getElementById('ch_amount').value = c.amount_per_flat ?? '';
  document.getElementById('ch_applies').value = c.applies_to || 'All Flats';
  document.getElementById('ch_date').value = c.date_started || '';
  document.getElementById('charges-form-title').textContent = `Editing "${roundName}"`;
  document.getElementById('ch_name').scrollIntoView({behavior:'smooth', block:'center'});
}
function resetChargeForm(){
  editingChargeRoundName = null;
  ['ch_name','ch_amount','ch_date'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('ch_applies').value = 'All Flats';
  document.getElementById('charges-form-title').textContent = 'Add Charge Round';
}
async function addCharge(){
  const newNameVal = document.getElementById('ch_name').value.trim();
  if(!newNameVal){ alert('Round Name khali nahi ho sakta.'); return; }
  const amountVal = Number(document.getElementById('ch_amount').value);
  if(!(amountVal > 0)){ alert('Rakam 0 se zyada honi chahiye.'); return; }
  await withPin(async ()=>{
    const newName = newNameVal;
    const payload = {
      round_name: newName,
      amount_per_flat: amountVal,
      applies_to: document.getElementById('ch_applies').value,
      date_started: document.getElementById('ch_date').value || null,
    };
    if(editingChargeRoundName && editingChargeRoundName !== newName){
      // Renaming a round: insert the new name first, repoint every collection
      // entry to it, then remove the old name — this order never leaves a
      // collections.purpose value pointing at a round_name that doesn't exist.
      const insertRes = await sb.from('charges').insert(payload);
      if(insertRes.error){ alert(friendlyDbError(insertRes.error)); return; }
      const moveRes = await sb.from('collections').update({purpose: newName}).eq('purpose', editingChargeRoundName);
      if(moveRes.error){ alert('Round renamed, lekin collections entries move karte waqt error: ' + friendlyDbError(moveRes.error)); return; }
      const deleteRes = await sb.from('charges').delete().eq('round_name', editingChargeRoundName);
      if(deleteRes.error){ alert('Warning: purani round "' + editingChargeRoundName + '" delete nahi ho payi: ' + friendlyDbError(deleteRes.error)); }
      editingChargeRoundName = null; refreshTab(); return;
    }
    const {error} = editingChargeRoundName
      ? await sb.from('charges').update(payload).eq('round_name', editingChargeRoundName)
      : await sb.from('charges').insert(payload);
    if(error) alert(friendlyDbError(error)); else { editingChargeRoundName = null; refreshTab(); }
  });
}

/* ---- Sticker Log tab ---- */
let vehiclesByFlatCache = [];
let firstIssuedVehicles = new Set();
let lastStickerFlat = null;
async function renderStickerLogTab(box){
  const [{data, error}, {data:flats}, {data:allVehicles}, {data:firstIssued}] = await Promise.all([
    sb.from('sticker_log').select('*').order('log_date',{ascending:false}).order('id',{ascending:false}),
    sb.from('flats').select('flat_no, owner_name').order('flat_no'),
    sb.from('vehicles').select('flat_no, vehicle_number, vehicle_type').order('flat_no'),
    sb.from('sticker_log').select('vehicle_number').eq('reason','First Issue')
  ]);
  vehiclesByFlatCache = allVehicles || [];
  firstIssuedVehicles = new Set((firstIssued||[]).map(r=>(r.vehicle_number||'').toUpperCase()));
  const vehicleTypeFor = (vnum) => {
    const v = vehiclesByFlatCache.find(x => (x.vehicle_number||'').toUpperCase() === (vnum||'').toUpperCase());
    return v ? v.vehicle_type : null;
  };
  // group entries by flat, like the Vehicles tab, so flat/date info isn't repeated per row
  const byFlat = {};
  (data||[]).forEach(s=>{
    if(!byFlat[s.flat_no]) byFlat[s.flat_no] = { flat_no:s.flat_no, entries:[] };
    byFlat[s.flat_no].entries.push(s);
  });
  const groups = Object.values(byFlat).sort((a,b)=>a.flat_no-b.flat_no);
  groups.forEach(g=> g.entries.sort((a,b)=>{
    const ta = vehicleTypeFor(a.vehicle_number) === 'Four Wheeler' ? 0 : 1;
    const tb = vehicleTypeFor(b.vehicle_number) === 'Four Wheeler' ? 0 : 1;
    if(ta !== tb) return ta - tb;
    return b.log_date.localeCompare(a.log_date);
  }));
  box.innerHTML = `
    <div class="card">
      <div class="accordion-header" onclick="toggleAccordion('acc_stickerlog')">
        <h3>Add Sticker Log Entry</h3>
        <span class="accordion-caret" id="acc_stickerlog_caret">▾</span>
      </div>
      <div class="accordion-body" id="acc_stickerlog_body" style="display:none; margin-top:12px;">
      <div class="form-row">
        <div class="field"><label>Date</label><input id="s_date" type="date"></div>
        <div class="field"><label>Flat No</label>
          <select id="s_flat" onchange="onStickerFlatChange()">${(flats||[]).map(f=>`<option value="${f.flat_no}">${f.flat_no}${f.owner_name?' — '+f.owner_name:''}</option>`).join('')}</select>
        </div>
        <div class="field"><label>Vehicle Number</label><select id="s_vnum" onchange="updateReasonOptions()"></select></div>
        <div class="field"><label>Reason</label>
          <select id="s_reason"></select>
        </div>
        <div class="field" style="flex:0"><button class="primary" onclick="addStickerLog()">Add</button></div>
      </div>
      ${error?`<div class="msg error">${friendlyDbError(error)}</div>`:''}
      </div>
    </div>
    ${groups.length ? groups.map(g=>`
    <div class="card floor-card" style="text-align:center;">
      <span class="pill flat-chip" style="background:${flatBadgeColor(g.flat_no)}; font-size:22px; padding:6px 22px;">${g.flat_no}</span>
      ${g.entries.map(s=>{
        const t = vehicleTypeFor(s.vehicle_number);
        const typeClass = t==='Two Wheeler' ? 'type-two' : t==='Four Wheeler' ? 'type-four' : '';
        return `<div class="flat-entry">
            ${t ? `<img src="${t==='Two Wheeler'?ICON_BIKE:ICON_CAR}" alt="" style="height:20px;">` : ''}
            <span class="mono vnum ${typeClass}" style="font-size:13.5px;">${fmtVehicleNumber(s.vehicle_number)}</span>
            <span class="mono config-note" style="margin:0">${fmtDate(s.log_date)}</span>
            ${(s.reason==='Shared Pass' || (s.reason||'').startsWith('No Separate Sticker'))
              ? `<span class="pill" style="background:#B45309; color:#fff; border-color:#B45309; font-weight:700; font-size:11px;">⚠ ${s.reason}</span>`
              : `<span class="config-note" style="margin:0">${s.reason||''}</span>`}
            <span class="flat-actions">
              <button class="danger" onclick="deleteRow('sticker_log','id',${s.id})" title="Delete">🗑️</button>
            </span>
          </div>`;
      }).join('')}
    </div>`).join('') : `<div class="card"><p class="empty">હજુ કોઈ એન્ટ્રી નથી.</p></div>`}`;
  if(lastStickerFlat && (flats||[]).some(f=>String(f.flat_no)===String(lastStickerFlat))){
    document.getElementById('s_flat').value = lastStickerFlat;
  }
  onStickerFlatChange();
}
function onStickerFlatChange(){
  const flatSel = document.getElementById('s_flat');
  const vnumSel = document.getElementById('s_vnum');
  if(!flatSel || !vnumSel) return;
  const flatNo = Number(flatSel.value);
  const matches = vehiclesByFlatCache.filter(v => v.flat_no === flatNo);
  vnumSel.innerHTML = matches.length
    ? matches.map(v=>`<option value="${v.vehicle_number}">${fmtVehicleNumber(v.vehicle_number)} — ${v.vehicle_type==='Two Wheeler'?'2-Wheeler':'4-Wheeler'}</option>`).join('')
    : `<option value="">આ ફ્લેટ માટે કોઈ વાહન નોંધાયેલ નથી</option>`;
  updateReasonOptions();
}
function updateReasonOptions(){
  const vnumSel = document.getElementById('s_vnum');
  const reasonSel = document.getElementById('s_reason');
  if(!vnumSel || !reasonSel) return;
  const selectedVnum = (vnumSel.value||'').toUpperCase();
  const alreadyIssued = selectedVnum && firstIssuedVehicles.has(selectedVnum);
  const options = [];
  if(!alreadyIssued) options.push('First Issue');
  options.push('Replacement - Lost', 'Replacement - Damaged', 'Shared Pass', 'No Separate Sticker (Owns 2 Four Wheeler)', 'Other');
  reasonSel.innerHTML = options.map(o=>`<option>${o}</option>`).join('');
}
async function addStickerLog(){
  const vehicleNumber = document.getElementById('s_vnum').value.toUpperCase().trim();
  const reason = document.getElementById('s_reason').value || null;
  if(reason === 'First Issue' && firstIssuedVehicles.has(vehicleNumber)){
    alert('This vehicle already has a First Issue sticker on record. Pick a Replacement reason instead.');
    return;
  }
  await withPin(async ()=>{
    lastStickerFlat = document.getElementById('s_flat').value;
    const payload = {
      log_date: document.getElementById('s_date').value || new Date().toISOString().slice(0,10),
      flat_no: Number(document.getElementById('s_flat').value),
      vehicle_number: vehicleNumber,
      reason: reason,
    };
    const {error} = await sb.from('sticker_log').insert(payload);
    if(error) alert(friendlyDbError(error)); else refreshTab();
  });
}

/* ---- Dues Summary tab (pivot: flat x charge round, with total) ---- */
let duesSelected = new Set();
let duesReminderLinks = {};
async function renderDuesTab(box){

  duesReminderLinks = {};

    sb.from('charges').select('round_name').order('round_name'),

    sb.from('flats').select('flat_no, contact_no'),
    loadWaSentCache(),
  ]);

  (flats||[]).forEach(f=> contactByFlat[f.flat_no] = f.contact_no);
  const roundNames = (rounds||[]).map(r=>r.round_name);
  const byFlat = {};
  (rows||[]).forEach(r=>{

  box.innerHTML = `

      <div class="grid-stats" style="margin:10px 0 0">
        <div class="stat ${grandTotal>0?'stat-bad':'stat-good'}"><div class="num mono">${fmtMoney(grandTotal)}</div><div class="lbl">⚖️ Total Pending (All Flats)</div></div>
      </div>
      ${e1||e2?`<div class="msg error">${friendlyDbError(e1||e2)}</div>`:''}
    </div>
    ${grandTotal>0 ? `<div class="card">
      <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
        <span id="dues-select-count" class="config-note" style="margin:0; font-weight:700;">0 flat(s) selected</span>
        <button onclick="selectAllPendingDues()">☑️ Select All Pending</button>
        <button onclick="clearDuesSelection()">Clear</button>
        <button class="primary" onclick="sendSelectedDuesReminders()" style="margin-left:auto;">${WA_ICON}Send Reminders</button>
      </div>
      <p class="config-note" style="margin-top:8px; margin-bottom:0;">ફ્લેટ સિલેક્ટ કરો, પછી "Send Reminders" દબાવો — એક પછી એક દરેક ફ્લેટનું WhatsApp ખુલશે, tap કરો અને આગલું આપોઆપ આવશે. WhatsApp કોઈપણ વેબસાઈટને એકસાથે બધાને મોકલવાની પરવાનગી નથી આપતું, એટલે આ સૌથી ઝડપી રીત છે.</p>
    </div>` : ''}
    ${!flatNos.length ? `<div class="card"><p class="empty">હજુ કોઈ ચાર્જ રાઉન્ડ સેટ નથી — "Charges" ટેબમાં એક ઉમેરો.</p></div>` : duesByFloorHtml(flatNos, byFlat, roundNames)}`;
}
function duesReminderMsg(flatNo, f, roundNames){
  const lines = roundNames.filter(r=>Number(f.perRound[r]||0)>0)
    .map(r=>`🧾 ${r}: ${fmtMoney(f.perRound[r])}`).join('\n');
  return `🙏 નમસ્તે ${f.owner_name||''},\n\nઆપની *Flat ${flatNo}* માટે મેન્ટેનન્સની નીચે મુજબ રકમ બાકી છે:\n\n💰 કુલ બાકી રકમ: ${fmtMoney(f.total)}\n${lines?lines+'\n':''}\nકૃપા કરી વહેલી તકે ચુકવણી કરવા વિનંતી છે 🙏🏻\n\n🏢 *C-Wing Society Maintenance*`;
}
function duesByFloorHtml(flatNos, byFlat, roundNames){
  const groups = {};
  flatNos.forEach(fn=>{
    const floor = Math.floor(fn/100);
    (groups[floor] = groups[floor] || []).push(fn);
  });
  const floorKeys = Object.keys(groups).map(Number).sort((a,b)=>a-b);
  return floorKeys.map(fk=>{
    const fns = groups[fk];
    const floorTotal = fns.reduce((s,fn)=>s+byFlat[fn].total, 0);
    return `<div class="card floor-card">
      <h3 class="floor-heading-center">🏢 Floor ${fk} <span class="config-note" style="display:inline; font-weight:600; margin-left:6px;">${fmtMoney(floorTotal)} pending</span></h3>
      ${fns.map(fn=>{
        const f = byFlat[fn];
        const breakdown = roundNames.filter(r=>Number(f.perRound[r]||0)>0)
          .map(r=>`<span class="config-note" style="margin:0;">${r}: ${fmtMoney(f.perRound[r])}</span>`).join('');
        const link = (f.total>0 && f.owner_name) ? waLink(f.contact_no, duesReminderMsg(fn, f, roundNames)) : null;
        const waKey = `dues:${fn}:${Math.round(f.total)}`;
        const pillId = `dues-wa-${fn}`;
        if(link) duesReminderLinks[fn] = {flatNo:fn, link, waKey, pillId};
        return `<div class="flat-entry" style="flex-direction:column; align-items:stretch; gap:4px;">
          <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
            ${link ? `<input type="checkbox" class="dues-select-cb" data-flat="${fn}" onchange="toggleDuesSelect(${fn}, this.checked)" style="width:20px; height:20px; accent-color:var(--maroon); flex-shrink:0;">` : ''}
            <span class="pill flat-chip" style="background:${flatBadgeColor(fn)}">${fn}</span>
            <span class="owner-name" style="flex:1 1 100px; min-width:0;">${f.owner_name || '<span class="config-note" style="margin:0">કોઈ માલિક નથી</span>'}</span>
            <span class="mono" style="font-weight:800; font-size:15.5px; color:${f.total>0?'var(--danger)':'#15803D'};">${fmtMoney(f.total)}</span>
          </div>
          ${link ? `<div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding-left:2px;"><a href="${link}" target="_blank" class="btn" style="text-decoration:none; display:inline-flex; align-items:center" onclick="return openWaLink(event,'${link}','${waKey}','${pillId}')">${WA_ICON}Remind</a>${waSentPillHtml(waKey, pillId)}</div>` : ''}
          ${breakdown ? `<div style="display:flex; gap:10px; flex-wrap:wrap; padding-left:2px;">${breakdown}</div>` : ''}
        </div>`;
      }).join('')}
    </div>`;
  }).join('');
}

/* ---- Dues Summary bulk reminders — select flats, then work through
   their WhatsApp chats one at a time. WhatsApp gives no way for a
   website to message multiple contacts in one go, so this is a
   guided queue: each tap opens the next flat's chat and auto-advances,
   instead of making the admin scroll and hunt for each flat manually. */
function toggleDuesSelect(flatNo, checked){
  if(checked) duesSelected.add(flatNo); else duesSelected.delete(flatNo);
  updateDuesSelectToolbar();
}
function selectAllPendingDues(){
  Object.keys(duesReminderLinks).forEach(fn=> duesSelected.add(Number(fn)));
  document.querySelectorAll('.dues-select-cb').forEach(cb=> cb.checked = true);
  updateDuesSelectToolbar();
}
function clearDuesSelection(){
  duesSelected.clear();
  document.querySelectorAll('.dues-select-cb').forEach(cb=> cb.checked = false);
  updateDuesSelectToolbar();
}
function updateDuesSelectToolbar(){
  const el = document.getElementById('dues-select-count');
  if(el) el.textContent = `${duesSelected.size} flat(s) selected`;
}
function sendSelectedDuesReminders(){
  if(!duesSelected.size){ alert('Pehle kam se kam ek flat select karo.'); return; }
  withPin(async ()=>{
    const items = [...duesSelected].map(fn=>duesReminderLinks[fn]).filter(Boolean);
    startWaQueue(items);
  });
}
let waQueue = [];
let waQueueIndex = 0;
function startWaQueue(items){
  waQueue = items;
  waQueueIndex = 0;
  showWaQueueModal();
}
function showWaQueueModal(){
  const old = document.getElementById('wa-queue-modal');
  if(old) old.remove();
  if(waQueueIndex >= waQueue.length){
    const done = waQueue.length;
    waQueue = []; waQueueIndex = 0;
    if(done){ alert(`✅ ${done} flat(s) ka reminder process complete ho gaya.`); refreshTab(); }
    return;
  }
  const item = waQueue[waQueueIndex];
  const overlay = el(`<div class="modal-backdrop" id="wa-queue-modal">
    <div class="modal-box">
      <h3>Reminder ${waQueueIndex+1} / ${waQueue.length}</h3>
      <p class="config-note">Flat ${item.flatNo} નું WhatsApp ખોલવા માટે નીચે બટન દબાવો — મોકલ્યા પછી આગલો ફ્લેટ આપોઆપ આવશે.</p>
      <div class="modal-actions" style="justify-content:space-between;">
        <button onclick="skipWaQueue()">Skip</button>
        <a href="${item.link}" target="_blank" class="btn primary" style="text-decoration:none;" onclick="return sendWaQueueItem()">${WA_ICON}Flat ${item.flatNo} ko bhejo</a>
      </div>
      <div class="modal-actions">
        <button onclick="closeWaQueueModal()">Close</button>
      </div>
    </div>
  </div>`);
  document.body.appendChild(overlay);
}
function sendWaQueueItem(){
  const item = waQueue[waQueueIndex];
  window.open(item.link, '_blank');
  setWaSent(item.waKey, true);
  waQueueIndex++;
  showWaQueueModal();
  return false;
}
function skipWaQueue(){ waQueueIndex++; showWaQueueModal(); }
function closeWaQueueModal(){ document.getElementById('wa-queue-modal')?.remove(); waQueue = []; waQueueIndex = 0; }

/* ---- Builder Receipt — one official-style receipt image per Unsold
   flat, for last month's maintenance share, sent to the builder's
   WhatsApp. Per-flat amount = (last month's common-category expense
   total ÷ 52) — same rate used for Sold flats, just isolated to the
   Unsold count as requested. ---- */
let builderReceiptCache = null;
async function getBuilderReceiptData(){
  const today = new Date();
  const {month: prevMonthNum, year: prevYear} = getPrevMonthYear();
  const startDate = `${prevYear}-${String(prevMonthNum).padStart(2,'0')}-01`;
  const endDateExclusive = prevMonthNum===12 ? `${prevYear+1}-01-01` : `${prevYear}-${String(prevMonthNum+1).padStart(2,'0')}-01`;
  const lastDay = new Date(prevYear, prevMonthNum, 0).getDate();
  const endDateDisplay = `${prevYear}-${String(prevMonthNum).padStart(2,'0')}-${String(lastDay).padStart(2,'0')}`;
  const todayISO = today.toISOString().slice(0,10);
  const roundName = builderRoundNameFor(prevMonthNum, prevYear);

  const [{data:exp}, {data:unsoldFlats}, {data:existingRound}] = await Promise.all([
    sb.from('expenses').select('amount').in('category', COMMON_EXPENSE_CATEGORIES).gte('expense_date', startDate).lt('expense_date', endDateExclusive),
    sb.from('v_flats').select('flat_no').eq('status','Unsold').order('flat_no'),
    sb.from('charges').select('*').eq('round_name', roundName).maybeSingle(),
  ]);
  const monthTotal = (exp||[]).reduce((s,e)=>s+Number(e.amount||0),0);
  const perFlat = monthTotal / TOTAL_FLATS_FIXED;
  const unsoldCount = (unsoldFlats||[]).length;

  // A Charges round for this month ("Builder Maintenance - <Month> <Year>",
  // Unsold Flats Only) is what lets Add Collection / Bulk Builder Payment
  // track which flats have already paid - create it once, the first time
  // this tab is opened for a given month, so it exists to record against.
  let round = existingRound;
  if(!round && perFlat > 0 && unsoldCount > 0){
    const {data:ins, error} = await sb.from('charges').insert({
      round_name: roundName,
      amount_per_flat: perFlat,
      applies_to: 'Unsold Flats Only',
      date_started: startDate,
    }).select().maybeSingle();
    if(!error) round = ins;
  } else if(round){
    // Round already existed — refresh its stored rate to match the live
    // total in case an expense was added/edited after it was first
    // created (see syncBuilderRoundRate), so Pending amounts stay correct.
    const synced = await syncBuilderRoundRate(roundName, perFlat);
    if(synced !== null) round.amount_per_flat = synced;
  }

  let pendingFlats = [];
  if(round){
    const {data:dues} = await sb.from('v_dues_summary').select('flat_no, pending_amount').eq('round_name', roundName).gt('pending_amount', 0);
    pendingFlats = (dues||[]).map(d=>({flat_no:d.flat_no, amount:Number(d.pending_amount)})).sort((a,b)=>a.flat_no-b.flat_no);
  }
  const totalPending = pendingFlats.reduce((s,f)=>s+f.amount,0);
  const amountPerFlat = round ? Number(round.amount_per_flat) : perFlat;
  return { roundName, unsoldCount, amountPerFlat, pendingFlats, totalPending, startDate, endDateDisplay, todayISO, monthTotal, hasRound: !!round };
}

  box.innerHTML = `<div class="card"><p class="empty">લોડ થઈ રહ્યું છે…</p></div>`;

  const monthLabel = `${fmtDate(data.startDate)} થી ${fmtDate(data.endDateDisplay)}`;

  ctx.strokeStyle = '#14162B'; ctx.lineWidth = 3;
  rr(14,14,W-28,H-28,16); ctx.stroke();

  ctx.fillStyle = '#14162B';
  ctx.textAlign = 'center';
  ctx.font = '700 15px Arial';
  ctx.fillText('॥ શ્રી ॥', W/2, 46);

  ctx.font = '700 14px Arial';
  ctx.fillText('No.: REG/SUR/SA(HAA)-20601/2025', W/2, 104);
  ctx.font = '500 12.5px Arial';
  ctx.fillText('સર્વે નં.૧૧૫, ટી.પી. સ્કીમ નં. ૫૨, એફ.પી. નં.૬૧ પૈકી સબ પ્લોટ નં.૧, તા. કતારગામ, જિ. સુરત', W/2, 124);

  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(30, 142); ctx.lineTo(W-30, 142); ctx.stroke();

  ctx.textAlign = 'left';
  ctx.font = '600 15px Arial';
  ctx.fillText(`રસીદ નં.: ${receiptNo}`, 40, 180);
  ctx.textAlign = 'right';
  ctx.fillText(`તા. ${todayStr}`, W-40, 180);

  ctx.textAlign = 'left';
  ctx.font = '700 17px Arial';
  ctx.fillStyle = '#1D5FA8';
  ctx.fillText('નામ: કિરણ ક્લાસિક ટાવર-૩ બિલ્ડર', 40, 220);
  ctx.fillStyle = '#14162B';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(40,227); ctx.lineTo(440,227); ctx.stroke();

  ctx.font = '700 15px Arial';
  ctx.fillText('ફ્લેટ નં.:', 480, 210);
  ctx.strokeRect(548, 192, 34, 32);
  ctx.font = '800 18px Arial';
  ctx.textAlign = 'center';
  ctx.fillText('C', 548+17, 213);
  ctx.strokeRect(586, 192, 90, 32);
  ctx.fillText(String(flatNo), 586+45, 213);

  ctx.font = '600 14px Arial';
  ctx.fillText('આજ રોજ આપના તરફથી', W/2, 258);

  const tableX = 40, tableY = 278, tableW = 430, rowH = 34;
  const rows = ['(૧) મેન્ટેનન્સ ફી','(૨) ટ્રાન્સફર ફી','(૩) વહીવટી ફાળો','(૪) બેન્કવેટ હોલ ફી','(૫) અન્ય ફી','ટોટલ...'];
  const col2X = tableX + 280;
  ctx.lineWidth = 1.5;
  ctx.strokeRect(tableX, tableY, tableW, rowH*(rows.length+1));
  ctx.beginPath(); ctx.moveTo(col2X, tableY); ctx.lineTo(col2X, tableY+rowH*(rows.length+1)); ctx.stroke();
  ctx.font = '700 14px Arial'; ctx.textAlign = 'center';
  ctx.fillText('વિગત', tableX+140, tableY+22);
  ctx.fillText('રૂપિયા', col2X+(tableW-280)/2, tableY+22);
  ctx.beginPath(); ctx.moveTo(tableX, tableY+rowH); ctx.lineTo(tableX+tableW, tableY+rowH); ctx.stroke();
  rows.forEach((label,i)=>{
    const y = tableY + rowH*(i+1);
    ctx.beginPath(); ctx.moveTo(tableX, y+rowH); ctx.lineTo(tableX+tableW, y+rowH); ctx.stroke();
    ctx.font = '600 13.5px Arial'; ctx.textAlign = 'left';
    ctx.fillText(label, tableX+10, y+22);
    ctx.font = '800 15px Arial'; ctx.textAlign = 'center';
    if(i===0 || i===rows.length-1){
      // row (1) Maintenance Fee and the Total row carry the per-flat amount;
      // rows (2)-(5) show a dash, per the fixed receipt-book pattern
      ctx.fillText(fmtMoney(amount), col2X+(tableW-280)/2, y+22);
    } else {
      ctx.fillText('-', col2X+(tableW-280)/2, y+22);
    }
  });

  let rx = 500, ry = 298;
  ctx.textAlign = 'left'; ctx.font = '700 15px Arial';
  ctx.fillText(`રૂા. ${fmtMoney(amount)}`, rx, ry);
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(rx+40, ry+6); ctx.lineTo(rx+300, ry+6); ctx.stroke();
  ry += 42;
  ctx.font = '600 13.5px Arial';
  ctx.fillText(`તા. ${startStr} થી તા. ${endStr} સુધી`, rx, ry);
  ry += 42;
  ctx.fillText(`રોકડા ${fmtMoney(amount)} મળ્યા છે.`, rx, ry);
  ry += 48;
  ctx.font = '700 14px Arial'; ctx.textAlign = 'center';
  ctx.fillText('ફોર, કિરણ કલાસિક ટાવર ૩ કો.ઓ.હા.સ.સો.લી.', rx+150, ry);
  // secretary's signature, stamped above the સહી line on every receipt
  if(BUILDER_SIGN_IMG.complete && BUILDER_SIGN_IMG.naturalWidth){
    const signW = 130, signH = signW * BUILDER_SIGN_IMG.naturalHeight / BUILDER_SIGN_IMG.naturalWidth;
    ctx.drawImage(BUILDER_SIGN_IMG, rx+150-signW/2, ry+8, signW, signH);
  }
  ry += 74;
  ctx.font = '600 13px Arial';
  ctx.fillText('પ્રમુખશ્રી / ઉપપ્રમુખશ્રી / સેકેટરીની સહી', rx+150, ry);

  ctx.textAlign = 'left'; ctx.font = 'italic 500 12px Arial'; ctx.fillStyle = '#6B7280';
  ctx.fillText('*Subject to realization of Cheque', 40, H-30);

  return canvas;
}
function builderReceiptAmountFor(flatNo){
  const d = builderReceiptCache;
  if(!d) return 0;
  const f = d.pendingFlats.find(x=>x.flat_no===flatNo);
  return f ? f.amount : d.amountPerFlat;
}
/* Receipt numbers work like a physical receipt book: start at 1 and
   count up forever, one number per flat per month, never reused. Each
   assigned number is stored as a special row in the existing wa_sent
   table (entity_key "brno|<no>|<roundName>|<flatNo>") so it survives
   phone/browser changes. Re-previewing the same flat's receipt for the
   same month reuses its already-assigned number. */
async function ensureBuilderReceiptNo(flatNo, roundName){
  const {data, error} = await sb.from('wa_sent').select('entity_key').like('entity_key','brno|%');
  if(error){ alert(friendlyDbError(error)); return null; }
  const rows = (data||[]).map(r=>{
    const p = String(r.entity_key).split('|');
    return {no:Number(p[1]), round:p[2], flat:Number(p[3])};
  }).filter(r=>Number.isFinite(r.no));
  const existing = rows.find(r=>r.round===roundName && r.flat===flatNo);
  if(existing) return existing.no;
  const next = rows.reduce((m,r)=>Math.max(m,r.no),0) + 1;
  const {error:insErr} = await sb.from('wa_sent').insert({entity_key:`brno|${next}|${roundName}|${flatNo}`, sent:true, updated_at:new Date().toISOString()});
  if(insErr){ alert('Receipt number save nahi hua — PIN unlock check kar ke dobara try karo.\n' + friendlyDbError(insErr)); return null; }
  return next;
}
async function previewBuilderReceipt(flatNo){
  if(!builderReceiptCache) return;
  const d = builderReceiptCache;
  const receiptNo = await ensureBuilderReceiptNo(flatNo, d.roundName);
  if(receiptNo === null) return;
  await builderSignReady();
  // receipt date = the day this receipt is actually generated/sent,
  // not the day the tab was first opened
  const todayStr = fmtDate(new Date().toISOString().slice(0,10));
  const canvas = drawBuilderReceiptCanvas(flatNo, builderReceiptAmountFor(flatNo), todayStr, fmtDate(d.startDate), fmtDate(d.endDateDisplay), receiptNo);
  const dataUrl = canvas.toDataURL('image/png');
  const old = document.getElementById('receipt-preview-modal');
  if(old) old.remove();
  const overlay = el(`<div class="modal-backdrop" id="receipt-preview-modal">
    <div class="modal-box" style="max-width:520px;">
      <h3>Receipt Preview — Flat C${flatNo}</h3>
      <div style="max-height:60vh; overflow:auto; border:1px solid var(--rule); border-radius:10px;">
        <img src="${dataUrl}" style="width:100%; display:block;">
      </div>
      <div class="modal-actions">
        <button onclick="document.getElementById('receipt-preview-modal').remove()">Band Karo</button>
        <button class="primary" onclick="downloadOneBuilderReceipt(${flatNo}); document.getElementById('receipt-preview-modal').remove();">⬇️ Download</button>
      </div>
    </div>
  </div>`);
  document.body.appendChild(overlay);
}
async function downloadOneBuilderReceipt(flatNo){
  if(!builderReceiptCache) return;
  const d = builderReceiptCache;
  const receiptNo = await ensureBuilderReceiptNo(flatNo, d.roundName);
  if(receiptNo === null) return;
  await builderSignReady();
  const todayStr = fmtDate(new Date().toISOString().slice(0,10));
  const canvas = drawBuilderReceiptCanvas(flatNo, builderReceiptAmountFor(flatNo), todayStr, fmtDate(d.startDate), fmtDate(d.endDateDisplay), receiptNo);
  canvas.toBlob((blob)=>{
    if(!blob) return;
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `Builder_Receipt_C${flatNo}_${d.startDate.slice(0,7)}.png`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
  }, 'image/png');
}
async function downloadAllBuilderReceipts(){
  if(!builderReceiptCache || !builderReceiptCache.pendingFlats.length){ alert('Koi pending Unsold flat nahi mila — sabka payment ho chuka hai.'); return; }
  for(const f of builderReceiptCache.pendingFlats){
    await downloadOneBuilderReceipt(f.flat_no);
    await new Promise(r=>setTimeout(r, 350));
  }
}
/* ---- generic delete (with a proper styled confirm popup) ---- */
function showConfirmModal(message, onYes){
  const old = document.getElementById('confirm-modal');
  if(old) old.remove();
  const overlay = el(`<div class="modal-backdrop" id="confirm-modal">
    <div class="modal-box">
      <h3>Are you sure?</h3>
      <p>${message}</p>
      <div class="modal-actions">
        <button onclick="document.getElementById('confirm-modal').remove()">Cancel</button>
        <button class="danger" id="confirm-modal-yes">Yes, delete</button>
      </div>
    </div>
  </div>`);
  document.body.appendChild(overlay);
  document.getElementById('confirm-modal-yes').onclick = async ()=>{
    overlay.remove();
    await onYes();
  };
}
/* Short, readable one-line description of a deleted row for the
   "Deleted Items" history list — table-specific, falls back to just
   the table name for anything unrecognized. */
function summarizeDeletedRow(table, row){
  if(!row) return table;
  if(table === 'expenses') return `${row.category||'Expense'} — ${fmtMoney(row.amount)} — ${fmtDate(row.expense_date)}${row.description?' ('+row.description+')':''}`;
  if(table === 'collections') return `Flat ${row.flat_no} — ${fmtMoney(row.amount)} — ${row.purpose||row.mode||''} — ${fmtDate(row.collection_date)}`;
  if(table === 'fund_transfers') return `Fund Transfer — ${fmtMoney(row.amount)}${row.transfer_date?' — '+fmtDate(row.transfer_date):''}${row.remarks?' ('+row.remarks+')':''}`;
  if(table === 'vehicles') return `Flat ${row.flat_no||''} — ${row.owner_name||''} — ${row.vehicle_type||'Vehicle'} ${row.vehicle_number||''}`;
  if(table === 'charges') return `Charges Round — "${row.round_name}" — ${fmtMoney(row.amount_per_flat)}/flat`;
  if(table === 'sticker_log') return `Sticker Log — Flat ${row.flat_no||''} — ${row.vehicle_number||''}`;
  return table;
}
async function deleteRow(table, col, val, isString){
  await withPin(async ()=>{
    showConfirmModal('Ye entry delete ho jayegi. Galti se delete ho jaye to "Deleted Items" (More menu) se wapas restore kar sakte ho.', async ()=>{
      // snapshot the full row BEFORE deleting, so it can be restored later
      const {data:snapshot} = await sb.from(table).select('*').eq(col, val).maybeSingle();
      const {error} = await sb.from(table).delete().eq(col, val);
      if(error) { alert(friendlyDbError(error)); return; }
      if(snapshot){
        await sb.from('deleted_items').insert({
          table_name: table,
          row_data: snapshot,
          summary: summarizeDeletedRow(table, snapshot),
        });
      }
      // clean up the matching WhatsApp Sent/Pending row so stale
      // status entries don't pile up in wa_sent after deletes
      if(table === 'collections') await setWaSent(`collection:${val}`, false);
      if(table === 'expenses') await setWaSent(`expense:${val}:group`, false);
      refreshTab();
    });
  });
}
/* ---- Deleted Items — undo/restore history for anything removed via
   deleteRow() above. Each delete snapshots the full row into
   deleted_items first; Restore re-inserts it (with a fresh id) and
   removes it from this history. ---- */
async function renderDeletedItemsTab(box){
  box.innerHTML = `<div class="card"><p class="empty">લોડ થઈ રહ્યું છે…</p></div>`;
  const {data, error} = await sb.from('deleted_items').select('*').order('deleted_at', {ascending:false}).limit(200);
  if(error){ box.innerHTML = `<div class="card"><div class="msg error">${friendlyDbError(error)}</div></div>`; return; }
  const items = data || [];
  box.innerHTML = `
    <div class="card">
      <h3>♻️ Deleted Items — Restore</h3>
      <p class="config-note" style="margin-top:-6px">Jo bhi Expense, Collection ya koi bhi entry galti se delete ho jaye, wo yahan dikhegi. "Restore" dabao to wo wapas aa jayegi.</p>
    </div>
    ${items.length ? `<div class="card">
      ${items.map(it=>`<div class="flat-entry" style="flex-direction:column; align-items:stretch; gap:6px;">
        <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
          <span class="pill" style="background:#EEF2FF; color:var(--maroon); border:1.5px solid var(--maroon); font-weight:700;">${it.table_name}</span>
          <span style="flex:1 1 150px; min-width:0; font-weight:600;">${it.summary || ''}</span>
        </div>
        <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding-left:2px;">
          <span class="config-note" style="margin:0;">Delete kiya: ${fmtDate(it.deleted_at)} ${new Date(it.deleted_at).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})}</span>
          <span class="flat-actions" style="margin-left:auto;">
            <button class="primary" onclick="restoreDeletedItem(${it.id})">↩️ Restore</button>
            <button class="danger" onclick="forgetDeletedItem(${it.id})" title="Hamesha ke liye hatao">🗑️</button>
          </span>
        </div>
      </div>`).join('')}
    </div>` : `<div class="card"><p class="empty">Koi deleted item nahi hai.</p></div>`}`;
}
function restoreDeletedItem(id){
  withPin(async ()=>{
    const {data:item, error} = await sb.from('deleted_items').select('*').eq('id', id).maybeSingle();
    if(error || !item){ alert((error && friendlyDbError(error)) || 'Ye item nahi mila.'); return; }
    const payload = {...item.row_data};
    delete payload.id; // let the DB assign a fresh id, avoids clashing with a re-used old one
    const {error:insErr} = await sb.from(item.table_name).insert(payload);
    if(insErr){ alert('Restore nahi ho paya: ' + friendlyDbError(insErr)); return; }
    await sb.from('deleted_items').delete().eq('id', id);
    refreshTab();
  });
}
function forgetDeletedItem(id){
  withPin(async ()=>{
    showConfirmModal('Ye history se hamesha ke liye hat jayega — is entry ko phir restore nahi kar paoge.', async ()=>{
      const {error} = await sb.from('deleted_items').delete().eq('id', id);
      if(error) { alert(friendlyDbError(error)); return; }
      refreshTab();
    });
  });
}

/* ---------------- boot ---------------- */
(async ()=>{
  if(pinStillValid()){
    const {data:{session}} = await sb.auth.getSession();
    if(session){ state.user = session.user; }
    else { localStorage.removeItem(PIN_UNLOCK_KEY); } // stale flag, session actually gone
  }
  state.tab = getDefaultTab();
  render();
  if(notifEnabled()){
    await ensureNotifBaseline();
    refreshNotifBadge();
    startNotifPolling();
  }
})();
if('serviceWorker' in navigator && location.protocol !== 'file:'){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}
