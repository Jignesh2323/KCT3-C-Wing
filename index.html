<style>
/* ============================================================
   DESIGN SYSTEM — clean, flat, mobile-first. Same class names
   as before throughout the JS, only the visual language changed,
   so no markup/logic had to move.
   Palette: cool light surface, indigo primary, soft tinted
   status chips (green/red/amber/blue) instead of ledger colors.
   Type: Space Grotesk (headings) + Inter (UI/body) + IBM Plex
   Mono (money, vehicle numbers, dates — anything tabular).
   ============================================================ */
:root{
  --paper:#F3F4F8;
  --paper-dark:#E9EBF3;
  --ink:#14162B;
  --ink-soft:#6B7280;
  --maroon:#4F46E5;
  --maroon-dark:#3D34C9;
  --ledger-green:#16A34A;
  --rule:#E4E6EF;
  --white-card:#FFFFFF;
  --danger:#DC2626;
  --warning:#B45309;
  --info:#0369A1;
  --maroon-glow:rgba(79,70,229,.28);
  --radius:18px;
  --radius-sm:12px;
  --shadow:0 1px 2px rgba(20,22,43,.04), 0 8px 24px rgba(20,22,43,.07);
  --shadow-lg:0 4px 10px rgba(20,22,43,.08), 0 16px 40px rgba(20,22,43,.14);
  --nav-h:64px;
}
:root[data-theme="dark"]{
  --paper:#12131C;
  --paper-dark:#1E2030;
  --ink:#ECEDF7;
  --ink-soft:#9AA0B8;
  --maroon:#8B85FF;
  --maroon-dark:#A5A0FF;
  --ledger-green:#34D399;
  --rule:#2E3145;
  --white-card:#1A1C2A;
  --danger:#F87171;
  --warning:#FBBF24;
  --info:#38BDF8;
  --maroon-glow:rgba(139,133,255,.35);
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  --shadow-lg:0 4px 10px rgba(0,0,0,.35), 0 16px 40px rgba(0,0,0,.5);
}
:root[data-theme="dark"] .stat-good{background:#0F2E22;}
:root[data-theme="dark"] .stat-good .num{color:#34D399;}
:root[data-theme="dark"] .stat-bad{background:#3A1414;}
:root[data-theme="dark"] .stat-bad .num{color:#F87171;}
:root[data-theme="dark"] .stat-neutral{background:#232349;}
:root[data-theme="dark"] .stat-neutral .num{color:#A5A0FF;}
:root[data-theme="dark"] .stat-info{background:#0E2A3A;}
:root[data-theme="dark"] .stat-info .num{color:#38BDF8;}
:root[data-theme="dark"] .stat-warning{background:#3A2A0E;}
:root[data-theme="dark"] .stat-warning .num{color:#FBBF24;}
:root[data-theme="dark"] .stat-two{background:#0E2E33;}
:root[data-theme="dark"] .stat-two .num{color:#22D3EE;}
:root[data-theme="dark"] .stat-four{background:#3A1414;}
:root[data-theme="dark"] .stat-four .num{color:#F87171;}
:root[data-theme="dark"] .stat-cash{background:#3A2A0E;}
:root[data-theme="dark"] .stat-cash .num{color:#FBBF24;}
:root[data-theme="dark"] .stat-bank{background:#0E2438;}
:root[data-theme="dark"] .stat-bank .num{color:#60A5FA;}
:root[data-theme="dark"] .pill.sold{background:#0F2E22; color:#34D399;}
:root[data-theme="dark"] .pill.unsold{background:var(--paper-dark);}
:root[data-theme="dark"] .msg.error{background:#3A1414; border-color:#7A3838;}
:root[data-theme="dark"] .msg.ok{background:#0F2E22; border-color:#2D6A4F;}
:root[data-theme="dark"] .search-safe{background:#0F2E22 !important; border-color:#34D399 !important;}
:root[data-theme="dark"] .search-safe::placeholder{color:#5FBE8A;}
:root[data-theme="dark"] button.danger{background:#3A1414; border-color:#7A3838;}
:root[data-theme="dark"] .hero-banner .who button.primary{background:var(--white-card); color:var(--maroon);}
*{box-sizing:border-box;}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:'Inter',sans-serif; font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
h1,h2,h3{font-family:'Space Grotesk',sans-serif; font-weight:700; margin:0 0 .3em; letter-spacing:-.01em;}
.mono{font-family:'IBM Plex Mono',monospace;}
.app{max-width:920px; margin:0 auto; padding:16px; padding-bottom:calc(var(--nav-h) + 28px + env(safe-area-inset-bottom));}

.hero-banner{
  position:relative;
  margin:-16px -16px 24px;
  background:linear-gradient(135deg, #3730A3 0%, var(--maroon) 55%, #7C3AED 100%);
  display:flex; align-items:flex-start; justify-content:space-between; gap:12px; flex-wrap:wrap;
  padding:22px 20px 26px;
  border-radius:0 0 26px 26px;
  box-shadow:0 14px 34px -10px rgba(55,48,163,.5);
  overflow:hidden;
}
.hero-banner::before{
  content:""; position:absolute; inset:0; z-index:0;
  background:radial-gradient(circle at 88% -15%, rgba(255,255,255,.28), transparent 55%);
}
.hero-banner .title-block{position:relative; z-index:1; display:flex; flex-direction:column; gap:3px; min-width:0;}
.hero-banner .eyebrow{
  color:rgba(255,255,255,.78); font-size:11px; font-weight:700;
  letter-spacing:.16em; text-transform:uppercase;
}
.hero-banner h1{
  color:#fff; font-size:22px; font-weight:800; margin:0; letter-spacing:-.01em; line-height:1.2;
  text-shadow:0 2px 12px rgba(0,0,0,.15);
}
.hero-banner .who{position:relative; z-index:1; display:flex; flex-direction:column-reverse; align-items:flex-end; gap:8px; font-size:13px; flex-shrink:0; margin-left:auto;}
.hero-banner .who button.primary{background:#fff; color:var(--maroon); border-color:#fff; box-shadow:0 2px 10px rgba(20,22,43,.2);}
.hero-banner .who button.primary:hover{background:#F3F4F8; border-color:#F3F4F8;}
.hero-banner .who button:not(.primary){background:rgba(255,255,255,.15); color:#fff; border-color:rgba(255,255,255,.4);}
.hero-banner .who button:not(.primary):hover{background:rgba(255,255,255,.25);}

button, .btn{
  font-family:'Inter',sans-serif; font-size:13.5px; font-weight:600;
  border:1.5px solid var(--rule); background:var(--white-card); color:var(--ink);
  padding:11px 18px; min-height:44px; border-radius:var(--radius-sm); cursor:pointer;
  transition:transform .1s ease, box-shadow .15s ease, background .15s ease, border-color .15s ease;
}
button:hover{border-color:#C7CAD9; background:var(--paper-dark);}
button:active{transform:scale(.97);}
button.primary{background:var(--maroon); color:#fff; border-color:var(--maroon); box-shadow:0 4px 14px var(--maroon-glow);}
button.primary:hover{background:var(--maroon-dark); border-color:var(--maroon-dark); box-shadow:0 6px 18px var(--maroon-glow);}
button.danger{border-color:#FCC; color:var(--danger); background:#FEF2F2;}
button.danger:hover{background:var(--danger); color:#fff; border-color:var(--danger);}

input, select, textarea{
  font-family:'Inter',sans-serif; font-size:15px; padding:11px 13px; min-height:44px;
  border:1.5px solid var(--rule); border-radius:var(--radius-sm); background:var(--white-card); color:var(--ink);
}
input:focus, select:focus, textarea:focus{outline:none; border-color:var(--maroon); box-shadow:0 0 0 3px rgba(79,70,229,.14);}
label{font-size:12px; color:var(--ink-soft); display:block; margin-bottom:6px; font-weight:600; letter-spacing:.01em;}
.field{margin-bottom:12px;}
.card{
  background:var(--white-card); border:1px solid var(--rule); border-radius:var(--radius);
  padding:20px; margin-bottom:18px; box-shadow:var(--shadow); overflow-x:auto;
}
.card h3{font-size:16.5px; margin-bottom:.5em;}
.grid-stats{display:flex; flex-wrap:wrap; gap:10px;}
.stat{border-radius:var(--radius-sm); padding:13px 16px; background:var(--paper-dark); flex:0 0 auto; border:1px solid rgba(20,22,43,.03); transition:transform .15s ease;}
.stat .num{font-family:'IBM Plex Mono',monospace; font-size:21px; font-weight:700; color:var(--ink);}
.stat .lbl{font-size:11px; font-weight:600; color:var(--ink-soft); margin-top:3px; letter-spacing:.01em;}
.lbl-icon{font-size:17px; margin-right:5px; vertical-align:-3px; display:inline-block;}
.stat-good{background:#ECFDF3;} .stat-good .num{color:#15803D;}
.stat-bad{background:#FEF2F2;} .stat-bad .num{color:#B91C1C;}
.stat-neutral{background:#EEF2FF;} .stat-neutral .num{color:#3730A3;}
.stat-info{background:#F0F9FF;} .stat-info .num{color:#0369A1;}
.stat-warning{background:#FFFBEB;} .stat-warning .num{color:#B45309;}
.stat-two{background:#ECFEFF;} .stat-two .num{color:#0E7490;}
.stat-four{background:#FEF2F2;} .stat-four .num{color:#B91C1C;}
.stat-cash{background:#FFFBEB;} .stat-cash .num{color:#B45309;}
.stat-bank{background:#EFF6FF;} .stat-bank .num{color:#1D4ED8;}
table{width:100%; border-collapse:collapse; font-size:13.5px;}
th{
  text-align:left; padding:9px 10px; white-space:nowrap;
  font-family:'Inter',sans-serif; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em;
  background:var(--paper-dark); color:var(--ink-soft); font-weight:700;
}
td{padding:9px 10px; border-bottom:1px solid var(--rule);}
tr:hover td{background:var(--paper-dark);}
.v-input{color:#1D4ED8;}
.v-formula{color:var(--ink);}
.floor-1{background:#FBEAEA;} .floor-1 .contact{color:#B33A2E;}
.floor-2{background:#EAF1FB;} .floor-2 .contact{color:#1D5FA8;}
.floor-3{background:#EDF6EA;} .floor-3 .contact{color:#3E8C2E;}
.floor-4{background:#FCEFE4;} .floor-4 .contact{color:#B35A18;}
.floor-5{background:#F0EBF8;} .floor-5 .contact{color:#5D3EA8;}
.floor-6{background:#FFF8E3;} .floor-6 .contact{color:#B3860A;}
.floor-7{background:#E7F3F4;} .floor-7 .contact{color:#207E8F;}
.floor-8{background:#FBE9E9;} .floor-8 .contact{color:#B32626;}
.floor-9{background:#E9F1FA;} .floor-9 .contact{color:#1D5FA8;}
.floor-10{background:#EBF6E7;} .floor-10 .contact{color:#3E9B2E;}
.floor-11{background:#FCEEE6;} .floor-11 .contact{color:#B34B18;}
.floor-12{background:#F5E9F0;} .floor-12 .contact{color:#A82368;}
.floor-13{background:#E9F5E9;} .floor-13 .contact{color:#278A22;}
.floor-x:hover td,[class*="floor-"]:hover td{filter:brightness(0.97);}
.veh-two{background:#E7F8F8;}
.veh-four{background:#FBE9E8;}
.mobile{font-weight:700; font-size:16px; letter-spacing:.01em; color:var(--maroon);}
.owner-name{font-weight:700; color:var(--ink);}
.flat-no{font-weight:800; font-size:17px;}
.search-safe{
  background:#ECFDF3 !important;
  border:1.5px solid var(--ledger-green) !important;
  font-weight:600;
}
.search-safe::placeholder{color:#4E9F6B;}
.search-safe-label{color:var(--ledger-green) !important; font-weight:700;}
.vnum{font-weight:700; font-size:16.5px; letter-spacing:.03em;}
.type-two{color:#0E7490; font-weight:600;}
.type-four{color:#B91C1C; font-weight:600;}
.modal-backdrop{
  position:fixed; inset:0; background:rgba(20,22,43,.5); display:flex; align-items:center; justify-content:center; z-index:1000; padding:16px;
}
.modal-box{
  background:var(--white-card); border:1px solid var(--rule); border-radius:18px; padding:22px 24px;
  max-width:360px; width:100%; box-shadow:var(--shadow-lg);
}
.modal-box h3{margin-bottom:10px;}
.modal-actions{display:flex; gap:10px; justify-content:flex-end; margin-top:16px;}

/* ---- Bottom navigation bar (mobile-app style) ---- */
.bottom-nav{
  position:fixed; left:0; right:0; bottom:0; z-index:60;
  max-width:920px; margin:0 auto;
  display:flex; align-items:stretch;
  background:rgba(255,255,255,.97); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  border-top:1px solid var(--rule); box-shadow:var(--shadow-lg);
  padding:6px 6px calc(6px + env(safe-area-inset-bottom));
}
.nav-item{
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  padding:6px 2px; border-radius:var(--radius-sm); cursor:pointer; position:relative;
  font-family:'Inter',sans-serif; font-size:10.5px; font-weight:600; color:var(--ink-soft);
  background:none; border:none; -webkit-tap-highlight-color:transparent; transition:color .15s ease;
}
.nav-item .nav-icon{
  font-size:20px; line-height:1; width:34px; height:26px; display:flex; align-items:center; justify-content:center;
  border-radius:10px; transition:background .15s ease, transform .15s ease;
}
.nav-item .nav-label{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%;}
.nav-item.active{color:var(--maroon);}
.nav-item.active .nav-icon{background:#EEF2FF; transform:translateY(-1px);}
.nav-more{position:relative;}
.more-menu{
  position:absolute; bottom:calc(100% + 12px); right:-6px; min-width:190px;
  background:var(--white-card); border:1px solid var(--rule); border-radius:14px;
  box-shadow:var(--shadow-lg); padding:6px; z-index:70;
  display:none; flex-direction:column; gap:2px;
}
.more-menu.open{display:flex;}
.more-menu-item{
  display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px;
  font-family:'Inter',sans-serif; font-size:13.5px; font-weight:600; color:var(--ink);
  cursor:pointer; text-align:left; white-space:nowrap;
}
.more-menu-item .nav-icon{font-size:16px; width:auto; height:auto; background:none;}
.more-menu-item:hover{background:var(--paper-dark);}
.more-menu-item.active{background:#EEF2FF; color:var(--maroon);}
.form-row{display:flex; gap:10px; flex-wrap:wrap; align-items:end; margin-bottom:16px;}
.form-row .field{flex:1; min-width:140px; margin-bottom:0;}
.msg{padding:10px 14px; border-radius:10px; margin-bottom:14px; font-size:13.5px;}
.msg.error{background:#FEF2F2; border:1px solid #FCC; color:var(--danger);}
.msg.ok{background:#ECFDF3; border:1px solid #BBF0D0; color:#15803D;}
.empty{color:var(--ink-soft); font-style:italic; padding:14px 0;}
.pill{
  font-family:'Inter',sans-serif; font-weight:600; font-size:11.5px; padding:3px 10px; border-radius:999px;
  border:1.5px solid currentColor; display:inline-block;
}
.pill.sold{color:#15803D; background:#ECFDF3;}
.pill.unsold{color:var(--ink-soft); background:var(--paper-dark);}
.pill-select{
  font-family:'Inter',sans-serif; font-weight:600; font-size:11.5px; padding:3px 8px; border-radius:999px;
  border:1.5px solid currentColor; background:transparent; cursor:pointer;
}
.pill-select.sold{color:#15803D;}
.pill-select.unsold{color:var(--ink-soft);}
.config-note{font-size:12px; color:var(--ink-soft); margin-top:6px;}
.bell-wrap{position:relative; display:inline-block; font-size:28px; line-height:1; cursor:pointer; color:#fff; padding:4px; -webkit-tap-highlight-color:transparent;}
.notif-badge{position:absolute; top:-6px; right:-8px; background:#DC2626; color:#fff; font-size:11px; font-weight:800; min-width:19px; height:19px; border-radius:999px; display:none; align-items:center; justify-content:center; padding:0 4px; border:2px solid var(--maroon-dark);}
@keyframes bellShake{
  0%, 100% { transform: rotate(0deg); }
  10%, 30%, 50%, 70% { transform: rotate(-14deg); }
  20%, 40%, 60%, 80% { transform: rotate(14deg); }
  90% { transform: rotate(-4deg); }
}
.bell-wrap.has-notif{ animation: bellShake 1.8s ease-in-out infinite; transform-origin: 50% 0%; }
.notif-panel{position:fixed; width:300px; max-width:85vw; max-height:360px; overflow-y:auto; background:var(--white-card); border:1px solid var(--rule); border-radius:14px; box-shadow:var(--shadow-lg); padding:6px; z-index:90; text-align:left;}
.notif-item{padding:10px; border-bottom:1px solid var(--rule); font-size:13px; color:var(--ink); font-weight:600;}
.notif-item:last-child{border-bottom:none;}
.accordion-header{display:flex; align-items:center; justify-content:space-between; gap:10px; cursor:pointer; padding:2px 0; -webkit-tap-highlight-color:transparent;}
.accordion-header h3{margin:0;}
.accordion-caret{font-size:13px; font-weight:800; color:var(--maroon); background:#EEF2FF; width:28px; height:28px; border-radius:8px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.floor-card h3{display:flex; align-items:baseline; flex-wrap:wrap; gap:4px;}
.floor-heading-center{justify-content:center; text-align:center; width:100%;}
.flat-entry{display:flex; flex-wrap:wrap; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--rule);}
.flat-entry:last-child{border-bottom:none;}
.flat-chip{color:#fff; font-weight:800; padding:4px 12px; border:none; font-size:13px;}
.flat-actions{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-left:auto;}
a{color:var(--maroon);}

@media (max-width:600px){
  .app{padding:12px; padding-bottom:calc(var(--nav-h) + 20px + env(safe-area-inset-bottom));}
  .hero-banner{margin:-12px -12px 16px; padding:16px 14px 14px;}
  .hero-banner h1{font-size:18px;}
  .hero-banner .eyebrow{font-size:10px;}
  .card{padding:14px; border-radius:14px;}
  .grid-stats{gap:8px;}
  .stat{flex:1 1 calc(33.333% - 6px); min-width:0; padding:8px 6px; text-align:center;}
  .stat .num{font-size:15px;}
  .stat .lbl{font-size:9px; line-height:1.25; margin-top:2px;}
  .lbl-icon{font-size:12px; margin-right:2px; vertical-align:-2px;}
  th, td{padding:8px 8px; font-size:12.5px;}
  .form-row{flex-direction:column; align-items:stretch; gap:12px;}
  .form-row .field{width:100%; min-width:0;}
  .form-row .field[style*="flex:0"]{width:100%;}
  .form-row button{width:100%;}
  .form-row.form-row-pair{flex-direction:row; gap:10px;}
  .form-row.form-row-pair .field{width:auto; flex:1 1 0;}
  .grid-stats-2col .stat{flex:1 1 calc(50% - 4px);}
}

@media print{
  .bottom-nav, .hero-banner .who, .form-row, .flat-actions, button, .nav-more{display:none !important;}
  .app{padding-bottom:0;}
  body{background:#fff;}
  .card{box-shadow:none; border:1px solid #ccc;}
}
</style>

<script>
/* ============================================================
   Supabase connection, money formatting, common expense
   categories + ÷52 split calculation.
   ============================================================ */

const SUPABASE_URL = "https://deyetzwxatogmdmjacvo.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRleWV0end4YXRvZ21kbWphY3ZvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM0MDUzNjcsImV4cCI6MjA5ODk4MTM2N30.wbdWs_Y0YvFOsQWjjodqPRuWS1H1Dx57jjb8GQtrkA0";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function fmtMoney(n){ n = Number(n||0); return '₹' + n.toLocaleString('en-IN'); }
function fmtDate(d){
  if(!d) return '';
  const [y,m,dd] = String(d).slice(0,10).split('-');
  return (y && m && dd) ? `${dd}/${m}/${y}` : String(d);
}
const PURPOSE_COLORS = ['#B33A2E','#1D5FA8','#3E8C2E','#B35A18','#5D3EA8','#B3860A','#207E8F','#B32626','#3E9B2E','#B34B18','#A82368','#278A22'];
function purposeColor(purpose){
  if(!purpose) return 'inherit';
  let hash = 0;
  for(let i=0;i<purpose.length;i++){ hash = (hash*31 + purpose.charCodeAt(i)) & 0xffffffff; }
  return PURPOSE_COLORS[Math.abs(hash) % PURPOSE_COLORS.length];
}
function waLink(phone, message){
  if(!phone) return null;
  let num = String(phone).replace(/\D/g,'');
  if(num.length === 10) num = '91' + num;
  if(num.length < 11) return null;
  return `https://wa.me/${num}?text=${encodeURIComponent(message)}`;
}
function waShareLink(message){
  // No phone number = WhatsApp opens its own chat/group picker so you can
  // send the pre-filled message to any chat, e.g. your society's group.
  return `https://wa.me/?text=${encodeURIComponent(message)}`;
}
/* ---- CSV report export (client-side, no server/library needed) ---- */
function toCSV(headers, rows){
  const esc = (v)=>{
    const s = String(v??'');
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
  };
  return [headers.join(','), ...rows.map(r=>r.map(esc).join(','))].join('\n');
}
function downloadCSV(filename, csv){
  const blob = new Blob(['﻿' + csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);

}

/* ---- Long-press-to-copy for phone numbers (no tap-to-call, so a
   stray tap while just browsing never opens the dialer by accident) ---- */
let longPressTimer = null;
function startLongPressCopy(e, number){
  clearTimeout(longPressTimer);
  if(!number) return;
  const target = e.currentTarget;
  longPressTimer = setTimeout(()=>{
    longPressTimer = null;
    navigator.clipboard.writeText(number).then(()=>{
      showCopyToast(target);
    }).catch(()=>{ alert('Copy nahi ho paya. Number: ' + number); });
  }, 450);
}
function cancelLongPressCopy(){
  if(longPressTimer){ clearTimeout(longPressTimer); longPressTimer = null; }
}
function showCopyToast(target){
  const rect = target.getBoundingClientRect();
  const toast = document.createElement('span');
  toast.textContent = '✓ Copied!';
  toast.style.cssText = 'position:fixed; background:#14162B; color:#fff; font-size:12px; font-weight:700; padding:5px 10px; border-radius:8px; z-index:2000; white-space:nowrap; pointer-events:none; box-shadow:0 4px 14px rgba(0,0,0,.25);';
  document.body.appendChild(toast);
  toast.style.left = Math.max(6, rect.left + rect.width/2 - toast.offsetWidth/2) + 'px';
  toast.style.top = (rect.top - 34) + 'px';
  setTimeout(()=> toast.remove(), 1200);
}
function copyableNumberAttrs(number, extraStyle){
  return `ontouchstart="startLongPressCopy(event,'${number}')" ontouchend="cancelLongPressCopy()" ontouchmove="cancelLongPressCopy()" onmousedown="startLongPressCopy(event,'${number}')" onmouseup="cancelLongPressCopy()" onmouseleave="cancelLongPressCopy()" style="user-select:none; -webkit-user-select:none; cursor:pointer; ${extraStyle||''}" title="કૉપિ કરવા માટે દબાવી રાખો"`;
}
function fmtVehicleNumber(num){
  if(!num) return '';
  const clean = num.toString().toUpperCase().replace(/\s|-/g,'');
  const m = clean.match(/^([A-Z]{2})(\d{1,2})([A-Z]{1,3})(\d{1,4})$/);
  return m ? `${m[1]}${m[2]}${m[3]} ${m[4]}` : clean;
}

/* ---- WhatsApp "sent / pending" tracking (saved on this device only) ----
   Lets you know who you've already WhatsApp'd for a given collection
   entry or expense-notify round, and who's still left. Auto-marks a
   flat as Sent the moment you tap the WhatsApp button; you can also
   tap the pill itself to flip it back to Pending (e.g. if you sent it
   by mistake, or want to re-send). */
let waSentCache = {};
async function loadWaSentCache(){
  const {data} = await sb.from('wa_sent').select('entity_key');
  waSentCache = {};
  (data||[]).forEach(r=> waSentCache[r.entity_key] = true);
}
function isWaSent(key){ return !!waSentCache[key]; }
async function setWaSent(key, val){
  if(val) waSentCache[key] = true; else delete waSentCache[key];
  const {error} = val
    ? await sb.from('wa_sent').upsert({entity_key: key, sent: true, updated_at: new Date().toISOString()})
    : await sb.from('wa_sent').delete().eq('entity_key', key);
  if(error) alert(error.message);
}
function waSentPillHtml(key, pillId){
  const sent = isWaSent(key);
  return `<span id="${pillId}" class="pill ${sent?'sold':'unsold'}" style="cursor:pointer; margin-left:4px" title="Tap to toggle Sent/Pending (PIN needed)" onclick="toggleWaSentPill('${key}','${pillId}')">${sent?'✓ Sent':'Pending'}</span>`;
}
function paintWaSentPill(pillId, sent){
  const p = document.getElementById(pillId);
  if(p){ p.textContent = sent ? '✓ Sent' : 'Pending'; p.classList.toggle('sold', sent); p.classList.toggle('unsold', !sent); }
}
function toggleWaSentPill(key, pillId){
  withPin(async ()=>{
    const now = !isWaSent(key);
    await setWaSent(key, now);
    paintWaSentPill(pillId, now);
  });
}
function openWaLink(event, link, key, pillId){
  event.preventDefault();
  withPin(async ()=>{
    window.open(link, '_blank');
    await setWaSent(key, true);
    paintWaSentPill(pillId, true);
  });
  return false;
}

function flatBadgeColor(flatNo){
  // golden-angle hue spacing spreads colors maximally around the wheel
  // so adjacent flat numbers never land on similar-looking hues.
  const n = Number(flatNo) || 0;
  const hue = (n * 137.508) % 360;
  const sat = 58 + (n % 3) * 8;   // 58/66/74 — small variation so even same-hue wraps differ
  const light = 38 + (n % 2) * 6; // 38/44
  return `hsl(${hue.toFixed(1)}, ${sat}%, ${light}%)`;
}

/* ---- Monthly Common Expense Split ---- */
const COMMON_EXPENSE_CATEGORIES = ['Security','Housekeeping','Electricity','Water','Lift Maintenance','Repair & Maintenance','Gardening','Pest Control','Admin/Stationery','KIRAN 3 Society Expense'];
const TOTAL_FLATS_FIXED = 52;
let cxMonth = new Date().getMonth()+1;
let cxYear = new Date().getFullYear();

function cxMonthOptionsHtml(){
  return ['January','February','March','April','May','June','July','August','September','October','November','December']
    .map((name,i)=>`<option value="${i+1}" ${i+1===cxMonth?'selected':''}>${name}</option>`).join('');
}
function cxYearOptionsHtml(){
  const curYear = new Date().getFullYear();
  const opts = [];
  for(let y=curYear-3; y<=curYear+1; y++) opts.push(`<option value="${y}" ${y===cxYear?'selected':''}>${y}</option>`);
  return opts.join('');
}
function onCxDateChange(){
  cxMonth = Number(document.getElementById('cx_month').value);
  cxYear = Number(document.getElementById('cx_year').value);
  renderCommonExpenseSplit();
}
async function renderCommonExpenseSplit(){
  const resultBox = document.getElementById('cx_result');
  if(!resultBox) return;
  resultBox.innerHTML = 'Loading...';
  const startDate = `${cxYear}-${String(cxMonth).padStart(2,'0')}-01`;
  const endDate = cxMonth===12 ? `${cxYear+1}-01-01` : `${cxYear}-${String(cxMonth+1).padStart(2,'0')}-01`;
  const [{data:exp, error:expErr}, {data:flats, error:flatsErr}] = await Promise.all([
    sb.from('expenses').select('amount').in('category', COMMON_EXPENSE_CATEGORIES).gte('expense_date', startDate).lt('expense_date', endDate),
    sb.from('v_flats').select('status')
  ]);
  if(expErr || flatsErr){
    resultBox.innerHTML = `<div class="msg error">${(expErr||flatsErr).message}</div>`;
    return;
  }
  const total = (exp||[]).reduce((sum,e)=>sum+Number(e.amount||0),0);
  const perFlat = total / TOTAL_FLATS_FIXED;
  const soldCount = (flats||[]).filter(f=>f.status==='Sold').length;
  const unsoldCount = (flats||[]).filter(f=>f.status==='Unsold').length;
  const soldTotal = perFlat * soldCount;
  const unsoldTotal = perFlat * unsoldCount;
  resultBox.innerHTML = `
    <div class="grid-stats grid-stats-2col">
      <div class="stat stat-bad"><div class="num mono">${fmtMoney(total)}</div><div class="lbl">Month Total (Common Categories)</div></div>
      <div class="stat stat-neutral"><div class="num mono">${fmtMoney(perFlat)}</div><div class="lbl">Per Flat (÷${TOTAL_FLATS_FIXED})</div></div>
      <div class="stat stat-good"><div class="num mono">${soldCount}</div><div class="lbl">Sold Flats Count</div></div>
      <div class="stat stat-good"><div class="num mono">${fmtMoney(soldTotal)}</div><div class="lbl">Sold Flats Total</div></div>
      <div class="stat stat-warning"><div class="num mono">${unsoldCount}</div><div class="lbl">Unsold Flats Count</div></div>
      <div class="stat stat-warning"><div class="num mono">${fmtMoney(unsoldTotal)}</div><div class="lbl">Unsold Flats Total (Builder Share)</div></div>
    </div>`;
}



</script>
<script>
/* ============================================================
   ADMIN APP — PIN-gated admin panel. Everything is in this
   single file (styles + logic), nothing else to download.
   ============================================================ */
const root = document.getElementById('root');
let state = { user:null, profile:null, tab:'dashboard', msg:null };

function el(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstChild; }

/* ---------------- Settings (device-local, no Supabase table needed) ---------------- */
const THEME_KEY = 'cwing_theme';
const NOTIF_ENABLED_KEY = 'cwing_notif_enabled';
const DEFAULT_TAB_KEY = 'cwing_default_tab';
const AUTOFILL_AMOUNT_KEY = 'cwing_autofill_amount';

function getTheme(){ return localStorage.getItem(THEME_KEY) || 'auto'; }
function applyTheme(){
  const theme = getTheme();
  const resolved = theme === 'auto'
    ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
    : theme;
  document.documentElement.setAttribute('data-theme', resolved);
}
function setTheme(theme){ localStorage.setItem(THEME_KEY, theme); applyTheme(); }
applyTheme();
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', ()=>{ if(getTheme()==='auto') applyTheme(); });

function notifEnabled(){ return localStorage.getItem(NOTIF_ENABLED_KEY) !== 'false'; }
function getDefaultTab(){ return localStorage.getItem(DEFAULT_TAB_KEY) || 'dashboard'; }
function setDefaultTab(k){ localStorage.setItem(DEFAULT_TAB_KEY, k); }
function autofillEnabled(){ return localStorage.getItem(AUTOFILL_AMOUNT_KEY) !== 'false'; }
function toggleNotifSetting(checked){
  localStorage.setItem(NOTIF_ENABLED_KEY, checked ? 'true' : 'false');
  if(checked){ ensureNotifBaseline().then(()=>{ refreshNotifBadge(); startNotifPolling(); }); }
  else {
    const badge = document.getElementById('notif-badge'); if(badge) badge.style.display = 'none';
    if(navigator.clearAppBadge){ try{ navigator.clearAppBadge(); }catch(e){} }
  }
  render();
}
function toggleAutofillSetting(checked){
  localStorage.setItem(AUTOFILL_AMOUNT_KEY, checked ? 'true' : 'false');
}

/* ---------------- PIN-gated WRITE access ----------------
   Viewing (dashboard, flats, expenses, vehicle search) never
   needs a PIN — it's open to everyone, same as before.
   Only when someone tries to Add/Edit/Delete/change status,
   a PIN prompt appears. Correct PIN signs into one shared
   hidden admin account behind the scenes, unlocking writes
   ON THIS DEVICE until the "Lock" button is pressed manually. */
const HIDDEN_ADMIN_EMAIL = "cwing-admin@internal.local";
const HIDDEN_ADMIN_PASSWORD = "CwingAdmin2026";
const ADMIN_PIN = "1201";
const PIN_UNLOCK_KEY = "cwing_pin_unlocked";

function pinStillValid(){
  return localStorage.getItem(PIN_UNLOCK_KEY) === "true";
}

/* Call this from any Add/Edit/Delete/status-change handler:
     withPin(async () => { ...the actual write... });
   If already unlocked (and not expired), the action runs immediately.
   Otherwise a PIN modal appears; the action only runs after the
   correct PIN is entered and the hidden account signs in. */
async function withPin(action){
  if(pinStillValid() && state.user){ await action(); return; }
  if(state.user && !pinStillValid()){ await sb.auth.signOut(); state.user = null; }
  showPinModal(action);
}

function showPinModal(action){
  const old = document.getElementById('pin-modal');
  if(old) old.remove();
  const overlay = el(`<div class="modal-backdrop" id="pin-modal">
    <div class="modal-box">
      <h3>Enter PIN</h3>
      <p class="config-note">ફેરફાર કરવા માટે જરૂરી છે. Lock ન દબાવો ત્યાં સુધી આ ડિવાઈસ પર અનલૉક રહેશે.</p>
      <div id="pin-modal-msg"></div>
      <input id="pin-modal-input" type="password" inputmode="numeric" maxlength="6" style="width:100%; letter-spacing:.3em; text-align:center; font-size:20px" autofocus>
      <div class="modal-actions">
        <button onclick="document.getElementById('pin-modal').remove(); render();">Cancel</button>
        <button class="primary" id="pin-modal-submit">Unlock</button>
      </div>
    </div>
  </div>`);
  document.body.appendChild(overlay);
  const submit = async ()=>{
    const pin = document.getElementById('pin-modal-input').value.trim();
    const msgBox = document.getElementById('pin-modal-msg');
    if(pin !== ADMIN_PIN){
      msgBox.innerHTML = `<div class="msg error">Wrong PIN.</div>`;
      return;
    }
    const {error} = await sb.auth.signInWithPassword({email: HIDDEN_ADMIN_EMAIL, password: HIDDEN_ADMIN_PASSWORD});
    if(error){ msgBox.innerHTML = `<div class="msg error">${error.message}</div>`; return; }
    localStorage.setItem(PIN_UNLOCK_KEY, "true");
    const {data:{session}} = await sb.auth.getSession();
    state.user = session ? session.user : null;
    overlay.remove();
    await action();
  };
  document.getElementById('pin-modal-submit').onclick = submit;
  document.getElementById('pin-modal-input').addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
}
async function lockNow(){
  await sb.auth.signOut();
  localStorage.removeItem(PIN_UNLOCK_KEY);
  state.user = null;
  if(HIDDEN_TAB_KEYS.includes(state.tab)) state.tab = 'dashboard';
  render();
}

/* Global gate: clicking/typing into ANY input box (except the two
   designated search boxes, which carry the .search-safe class)
   immediately asks for the PIN before the field can be used —
   not just when Add/Save is eventually clicked. Dropdowns
   (<select>) are left alone since choosing a value doesn't write
   anything by itself. */
document.addEventListener('focusin', (e)=>{
  const t = e.target;
  if(t.tagName === 'INPUT' && t.id !== 'pin-modal-input' && !t.classList.contains('search-safe') && !(pinStillValid() && state.user)){
    t.blur();
    showPinModal(async ()=>{ render(); });
  }
});

/* ---------------- render root — always shows the app, no view-lock ---------------- */
async function render(){
  await renderAdmin();
}

/* ---------------- shared topbar ---------------- */
function topbar(title){
  const unlocked = pinStillValid() && state.user;
  return `<div class="hero-banner">
    <div class="title-block">
      <div class="eyebrow">Kiran Classic Tower-3</div>
      <h1>C-Wing Maintenance Fund</h1>
    </div>
    <div class="who">
      <span class="pill ${unlocked?'sold':'unsold'}">${unlocked?'Unlocked':'View Only'}</span>
      <div style="display:flex; align-items:center; gap:8px;">
        ${notifEnabled() ? `<span class="bell-wrap" onclick="toggleNotifPanel(event)">🔔<span id="notif-badge" class="notif-badge">0</span>
        </span>` : ''}
        ${unlocked ? `<button onclick="lockNow()">Lock</button>` : `<button class="primary" onclick="unlockOnly()">Unlock</button>`}
      </div>
    </div>
  </div>`;
}
async function unlockOnly(){
  await withPin(async ()=>{ render(); });
}

/* ---------------- New-entry bell notification ----------------
   Tracks the highest collection/expense id already seen on THIS
   device (localStorage). Anything with a bigger id is "new" — shown
   as a red count on the bell and (where the OS/browser supports it)
   as a badge on the installed app icon. There is no server/push
   here, so this updates whenever the app is open or reopened, not
   while it's fully closed — a true always-on badge needs a push
   notification server, which this app doesn't have. */
const NOTIF_LAST_COLL_KEY = 'cwing_last_seen_coll_id';
const NOTIF_LAST_EXP_KEY = 'cwing_last_seen_exp_id';
let notifNewItems = [];
let notifIntervalStarted = false;

async function ensureNotifBaseline(){
  if(localStorage.getItem(NOTIF_LAST_COLL_KEY) !== null) return;
  const [{data:maxColl}, {data:maxExp}] = await Promise.all([
    sb.from('collections').select('id').order('id',{ascending:false}).limit(1),
    sb.from('expenses').select('id').order('id',{ascending:false}).limit(1),
  ]);
  localStorage.setItem(NOTIF_LAST_COLL_KEY, String(maxColl?.[0]?.id || 0));
  localStorage.setItem(NOTIF_LAST_EXP_KEY, String(maxExp?.[0]?.id || 0));
}
async function refreshNotifBadge(){
  const lastColl = Number(localStorage.getItem(NOTIF_LAST_COLL_KEY) || 0);
  const lastExp = Number(localStorage.getItem(NOTIF_LAST_EXP_KEY) || 0);
  const [{data:newColl}, {data:newExp}] = await Promise.all([
    sb.from('collections').select('id, flat_no, amount, purpose, collection_date, flats(owner_name)').gt('id', lastColl).order('id',{ascending:false}),
    sb.from('expenses').select('id, category, amount, description, expense_date').gt('id', lastExp).order('id',{ascending:false}),
  ]);
  notifNewItems = [
    ...(newColl||[]).map(c=>({type:'collection', id:c.id, text:`💰 ફ્લેટ ${c.flat_no}${c.flats?.owner_name?' — '+c.flats.owner_name:''}: ${fmtMoney(c.amount)} (${c.purpose||''})`, date:c.collection_date})),
    ...(newExp||[]).map(e=>({type:'expense', id:e.id, text:`📤 ${e.category}: ${fmtMoney(e.amount)}${e.description?' — '+e.description:''}`, date:e.expense_date})),
  ];
  const count = notifNewItems.length;
  const badge = document.getElementById('notif-badge');
  if(badge){ badge.style.display = count>0 ? 'flex' : 'none'; badge.textContent = count>99?'99+':String(count); }
  document.querySelector('.bell-wrap')?.classList.toggle('has-notif', count>0);
  if(navigator.setAppBadge){
    try{ count>0 ? navigator.setAppBadge(count) : navigator.clearAppBadge(); }catch(e){}
  }
}
function toggleNotifPanel(e){
  e.stopPropagation();
  const existing = document.getElementById('notif-panel');
  if(existing){ existing.remove(); return; }
  showNotifPanel();
}
function showNotifPanel(){
  const bell = document.querySelector('.bell-wrap');
  if(!bell) return;
  const rect = bell.getBoundingClientRect();
  const panel = document.createElement('div');
  panel.id = 'notif-panel';
  panel.className = 'notif-panel';
  panel.style.top = (rect.bottom + 8) + 'px';
  panel.style.right = Math.max(6, window.innerWidth - rect.right) + 'px';
  panel.innerHTML = notifNewItems.length
    ? notifNewItems.map(n=>`<div class="notif-item" style="cursor:pointer;" onclick="notifItemClick('${n.type}')">${n.text}<div class="config-note" style="margin:2px 0 0;">${fmtDate(n.date)}</div></div>`).join('')
    : `<div class="notif-item" style="text-align:center; color:var(--ink-soft); font-weight:500;">કોઈ નવી એન્ટ્રી નથી 🎉</div>`;
  // appended directly to <body> (not inside the hero banner) so its
  // dropdown isn't clipped by the banner's own overflow:hidden
  document.body.appendChild(panel);
  const collIds = notifNewItems.filter(n=>n.type==='collection').map(n=>n.id);
  const expIds = notifNewItems.filter(n=>n.type==='expense').map(n=>n.id);
  if(collIds.length) localStorage.setItem(NOTIF_LAST_COLL_KEY, String(Math.max(...collIds)));
  if(expIds.length) localStorage.setItem(NOTIF_LAST_EXP_KEY, String(Math.max(...expIds)));
  const badge = document.getElementById('notif-badge');
  if(badge) badge.style.display = 'none';
  if(navigator.clearAppBadge){ try{ navigator.clearAppBadge(); }catch(err){} }
}
document.addEventListener('click', (e)=>{
  const panel = document.getElementById('notif-panel');
  if(panel && !e.target.closest('.bell-wrap') && !e.target.closest('#notif-panel')) panel.remove();
});
function notifItemClick(type){
  document.getElementById('notif-panel')?.remove();
  setTab(type==='collection' ? 'collections' : 'expenses');
}
function startNotifPolling(){
  if(notifIntervalStarted) return;
  notifIntervalStarted = true;
  setInterval(refreshNotifBadge, 30000);
}

/* ============================================================
   ADMIN VIEW — tabs with list + simple add form per table
   ============================================================ */
const ADMIN_TABS = [
  ['dashboard','Dashboard'],
  ['flats','Flats'],
  ['collections','Collections'],
  ['expenses','Expenses'],
  ['transfers','Fund Transfer'],
  ['vehicles','Vehicles'],
  ['charges','Charges'],
  ['stickerlog','Sticker Log'],
  ['dues','Dues Summary'],
  ['settings','Settings'],
];

const HIDDEN_TAB_KEYS = ['transfers','charges','stickerlog','dues','settings'];
const NO_PIN_MORE_TABS = ['settings']; // secondary tabs reachable via More without a PIN
const TAB_ICONS = {
  dashboard: '🏠',
  flats: '🏢',
  collections: '📥',
  expenses: '📤',
  vehicles: '🚗',
  transfers: '🔁',
  charges: '🧾',
  stickerlog: '🏷️',
  dues: '📋',
  settings: '⚙️',
};

async function renderAdmin(){
  const primaryTabs = ADMIN_TABS.filter(([k])=> !HIDDEN_TAB_KEYS.includes(k));
  const secondaryTabs = ADMIN_TABS.filter(([k])=> HIDDEN_TAB_KEYS.includes(k));
  const onSecondary = HIDDEN_TAB_KEYS.includes(state.tab);
  root.innerHTML = `<div class="app">
    ${topbar('Admin')}
    <div id="tab-content"><div class="empty">લોડ થઈ રહ્યું છે…</div></div>
  </div>
  <nav class="bottom-nav">
    ${primaryTabs.map(([k,label])=>`<div class="nav-item ${state.tab===k?'active':''}" onclick="setTab('${k}')">
      <span class="nav-icon">${TAB_ICONS[k]||'•'}</span><span class="nav-label">${label}</span>
    </div>`).join('')}
    <div class="nav-item nav-more ${onSecondary?'active':''}" onclick="toggleMoreMenu(event)">
      <span class="nav-icon">⋯</span><span class="nav-label">More</span>
      <div class="more-menu" id="more-menu">
        ${secondaryTabs.map(([k,label])=>`<div class="more-menu-item ${state.tab===k?'active':''}" onclick="event.stopPropagation(); closeMoreMenu(); onMoreTabSelect('${k}')">
          <span class="nav-icon">${TAB_ICONS[k]||'•'}</span>${label}
        </div>`).join('')}
      </div>
    </div>
  </nav>`;
  await renderTabContent();
  if(notifEnabled()) refreshNotifBadge();
}
function toggleMoreMenu(e){
  e.stopPropagation();
  document.getElementById('more-menu')?.classList.toggle('open');
}
function closeMoreMenu(){
  document.getElementById('more-menu')?.classList.remove('open');
}
document.addEventListener('click', (e)=>{
  const menu = document.getElementById('more-menu');
  if(menu && menu.classList.contains('open') && !e.target.closest('.nav-more')) menu.classList.remove('open');
});
async function onMoreTabSelect(k){
  if(!k) return;
  if(NO_PIN_MORE_TABS.includes(k)){ state.tab = k; render(); return; }
  await withPin(async ()=>{ state.tab = k; render(); });
}
function setTab(k){ state.tab = k; render(); }

/* ---- Collapsible "Add ___" form cards — collapsed by default so the
   entry list sits close to the top and doesn't need heavy scrolling
   on mobile. Edit buttons force it open via openAccordion(). ---- */
function toggleAccordion(id){
  const body = document.getElementById(id+'_body');
  const caret = document.getElementById(id+'_caret');
  if(!body) return;
  const willOpen = body.style.display === 'none';
  body.style.display = willOpen ? '' : 'none';
  if(caret) caret.textContent = willOpen ? '▴' : '▾';
}
function openAccordion(id){
  const body = document.getElementById(id+'_body');
  const caret = document.getElementById(id+'_caret');
  if(body) body.style.display = '';
  if(caret) caret.textContent = '▴';
}

async function renderTabContent(){
  const box = document.getElementById('tab-content');
  if(!box) return;
  try{
    if(state.tab==='dashboard') return await renderDashboardTab(box);
    if(state.tab==='flats') return await renderFlatsTab(box);
    if(state.tab==='collections') return await renderCollectionsTab(box);
    if(state.tab==='expenses') return await renderExpensesTab(box);
    if(state.tab==='transfers') return await renderTransfersTab(box);
    if(state.tab==='vehicles') return await renderVehiclesTab(box);
    if(state.tab==='charges') return await renderChargesTab(box);
    if(state.tab==='stickerlog') return await renderStickerLogTab(box);
    if(state.tab==='dues') return await renderDuesTab(box);
    if(state.tab==='settings') return await renderSettingsTab(box);
  }catch(err){
    console.error(err);
    box.innerHTML = `<div class="msg error"><b>Something broke:</b> ${err.message || err}</div>`;
  }
}

/* ---- Dashboard tab ---- */
async function renderDashboardTab(box){
  const unlocked = pinStillValid() && state.user;
  const [{data:s}, {data:byMode}, {data:byCat}, {data:transfers}, {data:kiran3}] = await Promise.all([
    sb.from('v_dashboard_summary').select('*').maybeSingle(),
    sb.from('v_fund_by_mode').select('*'),
    sb.from('v_expense_by_category').select('*'),
    sb.from('fund_transfers').select('amount'),
    sb.from('expenses').select('category, amount').in('category', ['KIRAN 3 Society Advance', 'KIRAN 3 Society Expense']),
  ]);
  const totalTransferred = (transfers||[]).reduce((s,t)=>s+Number(t.amount||0),0);
  const cashRow = (byMode||[]).find(m => (m.mode||'').toLowerCase() === 'cash');
  const cashInHand = (Number(cashRow?.collected||0)) - (Number(cashRow?.spent||0)) - totalTransferred;
  const bankRows = (byMode||[]).filter(m => (m.mode||'').toLowerCase() !== 'cash');
  const bankBalance = bankRows.reduce((sum,m)=> sum + Number(m.collected||0) - Number(m.spent||0), 0) + totalTransferred;
  const kiran3Advance = (kiran3||[]).filter(e=>e.category==='KIRAN 3 Society Advance').reduce((s,e)=>s+Number(e.amount||0),0);
  const kiran3Expense = (kiran3||[]).filter(e=>e.category==='KIRAN 3 Society Expense').reduce((s,e)=>s+Number(e.amount||0),0);
  const kiran3Balance = kiran3Advance - kiran3Expense;
  box.innerHTML = `
    <div class="card"><h3>Summary</h3>
      <div class="grid-stats" style="margin-bottom:10px;">
        <div class="stat stat-neutral"><div class="num mono">${fmtMoney(cashInHand + bankBalance)}</div><div class="lbl"><span class="lbl-icon">⚖️</span>Total Balance</div></div>
        ${unlocked ? `<div class="stat stat-good"><div class="num mono">${fmtMoney(s?.total_collected)}</div><div class="lbl"><span class="lbl-icon">📥</span>Collected</div></div>
        <div class="stat stat-bad"><div class="num mono">${fmtMoney(s?.total_expense)}</div><div class="lbl"><span class="lbl-icon">📤</span>Expense</div></div>` : ''}
        <div class="stat stat-cash"><div class="num mono">${fmtMoney(cashInHand)}</div><div class="lbl"><span class="lbl-icon">💵</span>Cash in Hand</div></div>
        <div class="stat stat-bank"><div class="num mono">${fmtMoney(bankBalance)}</div><div class="lbl"><span class="lbl-icon">🏦</span>Bank Balance</div></div>
      </div>
      ${(kiran3Advance>0 || kiran3Expense>0) ? `<div class="grid-stats" style="margin-bottom:10px;">
        <div class="stat ${kiran3Balance>=0?'stat-good':'stat-bad'}"><div class="num mono">${kiran3Balance>=0?'+':'−'}${fmtMoney(Math.abs(kiran3Balance))}</div><div class="lbl"><span class="lbl-icon">🏢</span>KIRAN 3 Common Balance</div></div>
      </div>` : ''}
      <div class="grid-stats" style="margin-bottom:10px;">
        <div class="stat stat-info"><div class="num mono">${s?.total_flats??'-'}</div><div class="lbl"><span class="lbl-icon">🏢</span>Total Flats</div></div>
        <div class="stat stat-warning"><div class="num mono">${s?.unsold_flats??'-'}</div><div class="lbl"><span class="lbl-icon">🔑</span>Unsold Flats</div></div>
        <div class="stat stat-bad"><div class="num mono">${s?.flats_zero_collection??'-'}</div><div class="lbl"><span class="lbl-icon">🚫</span>Zero Collection</div></div>
      </div>
      <div class="grid-stats">
        <div class="stat stat-four"><div class="num mono type-four">${s?.total_four_wheelers??'-'}</div><div class="lbl"><img src="${ICON_CAR}" alt="" style="height:16px; vertical-align:-3px; margin-right:5px;">4-Wheelers</div></div>
        <div class="stat stat-two"><div class="num mono type-two">${s?.total_two_wheelers??'-'}</div><div class="lbl"><img src="${ICON_BIKE}" alt="" style="height:16px; vertical-align:-3px; margin-right:5px;">2-Wheelers</div></div>
      </div>
      <p class="config-note" style="margin-top:10px">રોકડ હાથમાં = રોકડ જમા − રોકડ ખર્ચ. બેંક બેલેન્સ = બાકીનું બધું (UPI/બેંક ટ્રાન્સફર/ચેક) જમા − ખર્ચ ભેગું.</p>
    </div>
    <div class="card"><h3>By Payment Mode</h3>
      <table><thead><tr><th>Mode</th><th>Collected</th><th>Spent</th></tr></thead><tbody>
      ${(byMode||[]).map(m=>`<tr><td style="font-weight:600">${m.mode}</td><td class="mono" style="border:none; font-weight:800; font-size:15px; color:#15803D;">${fmtMoney(m.collected)}</td><td class="mono" style="border:none; font-weight:800; font-size:15px; color:var(--danger);">${fmtMoney(m.spent)}</td></tr>`).join('')}
      </tbody></table>
    </div>
    <div class="card"><h3>Expense by Category</h3>
      <table><thead><tr><th>Category</th><th>Amount</th></tr></thead><tbody>
      ${(byCat||[]).map(c=>`<tr><td style="font-weight:600">${c.category}</td><td class="mono" style="font-weight:800; font-size:15px;">${fmtMoney(c.total_amount)}</td></tr>`).join('')}
      </tbody></table>
    </div>
    <div class="card">

function flatsByFloorHtml(data){
  if(!data.length) return `<div class="card"><p class="empty">હજુ કોઈ ફ્લેટ નથી.</p></div>`;
  const NO_FLOOR = 'none';
  const groups = {};
  data.forEach(f=>{
    const key = f.floor ?? NO_FLOOR;
    (groups[key] = groups[key] || []).push(f);
  });
  const floorKeys = Object.keys(groups).sort((a,b)=> (a===NO_FLOOR?Infinity:Number(a)) - (b===NO_FLOOR?Infinity:Number(b)));
  return floorKeys.map(fk=>{
    const flats = groups[fk];
    const soldCount = flats.filter(f=>f.status==='Sold').length;
    const label = fk===NO_FLOOR ? 'No Floor Set' : `Floor ${fk}`;
    return `<div class="card floor-card">
      <h3 class="floor-heading-center">🏢 ${label} <span class="config-note" style="display:inline; font-weight:600; margin-left:6px;">${flats.length} flat${flats.length>1?'s':''} · ${soldCount} sold</span></h3>
      ${flats.map(f=>flatEntryHtml(f)).join('')}
    </div>`;
  }).join('');
}
function flatEntryHtml(f){
  return `<div class="flat-entry">
    <span class="pill flat-chip" style="background:${flatBadgeColor(f.flat_no)}">${f.flat_no}</span>
    <span class="owner-name" style="flex:1 1 140px; min-width:0;">${f.owner_name || '<span class="config-note" style="margin:0">કોઈ માલિક નથી</span>'}</span>
    <span class="mono contact mobile" ${f.contact_no?copyableNumberAttrs(f.contact_no):''}>${f.contact_no||''}</span>
    <select onchange="updateFlatStatusInline(${f.flat_no}, this.value)" class="pill-select ${f.status==='Sold'?'sold':'unsold'}">
      <option value="Sold" ${f.status==='Sold'?'selected':''}>Sold</option>
      <option value="Unsold" ${f.status==='Unsold'?'selected':''}>Unsold</option>
    </select>
    <span class="flat-actions">
      <button onclick="editFlat(${f.flat_no})">Edit</button>
    </span>
  </div>`;
}
async function updateFlatStatusInline(flatNo, value){
  await withPin(async ()=>{
    const {error} = await sb.from('flats').update({status_override: value}).eq('flat_no', flatNo);
    if(error) alert(error.message);

  });

function populateFlatForm(flatNo){
  const f = flatsCache.find(x=>x.flat_no===flatNo);

  openAccordion('acc_flats');
  document.getElementById('f_no').value = f.flat_no;
  document.getElementById('f_floor').value = f.floor ?? '';
  document.getElementById('f_owner').value = f.owner_name || '';
  document.getElementById('f_contact').value = f.contact_no || '';
  document.getElementById('f_status').value = f.status_override || '';
  document.getElementById('f_remarks').value = f.remarks || '';

async function editFlat(flatNo){
  if(pinStillValid() && state.user){ populateFlatForm(flatNo); return; }

}
function resetFlatForm(){
  ['f_no','f_floor','f_owner','f_contact','f_remarks'].forEach(id=>document.getElementById(id).value='');

  document.getElementById('flats-form-title').textContent = 'Add / Update Flat';

async function upsertFlat(){
  await withPin(async ()=>{
    const payload = {
      flat_no: Number(document.getElementById('f_no').value),
      floor: document.getElementById('f_floor').value || null,
      owner_name: document.getElementById('f_owner').value || null,
      contact_no: document.getElementById('f_contact').value || null,
      status_override: document.getElementById('f_status').value || null,
      remarks: document.getElementById('f_remarks').value || null,

function onCollectionPurposeChange(){

}
function populateCollectionFlatOptions(){
  const purpose = document.getElementById('c_purpose')?.value;
  const flatSel = document.getElementById('c_flat');
  if(!purpose || !flatSel) return;
  const pendingFlatNos = pendingFlatsByRoundCache[purpose] || [];
  const options = pendingFlatNos
    .map(fn => flatsListCache.find(f=>f.flat_no===fn))
    .filter(Boolean)
    .sort((a,b)=>a.flat_no-b.flat_no);
  flatSel.innerHTML = options.length
    ? options.map(f=>`<option value="${f.flat_no}">${f.flat_no}${f.owner_name?' — '+f.owner_name:''}</option>`).join('')
    : `<option value="">Is round me koi bhi flat pending nahi hai</option>`;
}
function autofillCollectionAmount(){
  if(!autofillEnabled()) return;
  const purpose = document.getElementById('c_purpose')?.value;
  const amountField = document.getElementById('c_amount');
  if(!purpose || !amountField) return;
  const round = chargesCache.find(c=>c.round_name===purpose);
  if(round) amountField.value = round.amount_per_flat;
}
async function updateBulkBuilderTotal(){
  const purpose = document.getElementById('bb_purpose')?.value;
  const note = document.getElementById('bb_calc_note');
  if(!purpose || !note) return;
  const round = chargesCache.find(c=>c.round_name===purpose);
  const perFlat = Number(round?.amount_per_flat||0);
  note.textContent = 'Calculating…';
  const [{data:unsoldFlats}, {data:existing}] = await Promise.all([
    sb.from('v_flats').select('flat_no').eq('status','Unsold'),
    sb.from('collections').select('flat_no').eq('purpose', purpose)
  ]);
  const alreadyDone = new Set((existing||[]).map(c=>c.flat_no));
  const targetCount = (unsoldFlats||[]).filter(f=>!alreadyDone.has(f.flat_no)).length;
  const total = perFlat * targetCount;
  document.getElementById('bb_total').value = total || '';
  note.textContent = targetCount
    ? `${fmtMoney(perFlat)} × ${targetCount} unsold flat(s) still due for "${purpose}" = ${fmtMoney(total)} (auto-calculated — badal sakte ho agar zaroorat ho)`
    : `Sabhi Unsold flats ka "${purpose}" ke liye collection pehle se hi entered hai.`;
}

async function addCollection(){
  const flatVal = document.getElementById('c_flat').value;
  if(!flatVal){ alert('Is round me koi bhi flat pending nahi hai — dusra Purpose (Round) select karo.'); return; }
  const flatNo = Number(flatVal);
  const purpose = document.getElementById('c_purpose').value;
  const {data: existing} = await sb.from('collections').select('*').eq('flat_no', flatNo).eq('purpose', purpose);
  if(existing && existing.length){
    const prior = existing[0];
    const proceed = confirm(`⚠ Flat ${flatNo} already has a collection entry for "${purpose}" — ${fmtMoney(prior.amount)} on ${fmtDate(prior.collection_date)}.\n\nAdd another entry for this flat + purpose anyway?`);
    if(!proceed) return;
  }
  await withPin(async ()=>{
    const payload = {
      flat_no: flatNo,
      collection_date: document.getElementById('c_date').value || new Date().toISOString().slice(0,10),
      amount: Number(document.getElementById('c_amount').value),
      mode: document.getElementById('c_mode').value,
      purpose: purpose,
      remarks: document.getElementById('c_remarks').value || null,
    };
    const {error} = await sb.from('collections').insert(payload);
    if(error) alert(error.message); else refreshTab();
  });
}
async function bulkBuilderPayment(){
  const purpose = document.getElementById('bb_purpose').value;
  const date = document.getElementById('bb_date').value || new Date().toISOString().slice(0,10);
  const total = Number(document.getElementById('bb_total').value);
  const mode = document.getElementById('bb_mode').value;
  const remarks = document.getElementById('bb_remarks').value || null;
  if(!purpose){ alert('Purpose (Round) select karo.'); return; }
  if(!total || total <= 0){ alert('Valid Total Amount daalo.'); return; }

  const [{data:unsoldFlats, error:e1}, {data:existing, error:e2}] = await Promise.all([
    sb.from('v_flats').select('flat_no').eq('status','Unsold'),
    sb.from('collections').select('flat_no').eq('purpose', purpose)
  ]);
  if(e1 || e2){ alert((e1||e2).message); return; }
  if(!unsoldFlats || !unsoldFlats.length){ alert('Koi Unsold flat nahi mila.'); return; }

  const alreadyDone = new Set((existing||[]).map(c=>c.flat_no));
  const targetFlats = unsoldFlats.filter(f=>!alreadyDone.has(f.flat_no));
  const skipped = unsoldFlats.length - targetFlats.length;
  if(!targetFlats.length){ alert(`Sabhi ${unsoldFlats.length} Unsold flats ka "${purpose}" ke liye collection pehle se hi entered hai.`); return; }

  const perFlat = total / targetFlats.length;
  const proceed = confirm(`${targetFlats.length} Unsold flats me ${fmtMoney(perFlat)} per flat (total ${fmtMoney(total)}) ki entry banegi, purpose "${purpose}".${skipped?`\n${skipped} flat(s) already have an entry for this round — unhe skip kiya jayega.`:''}\n\nProceed?`);
  if(!proceed) return;

  await withPin(async ()=>{
    const payload = targetFlats.map(f=>({
      flat_no: f.flat_no,
      collection_date: date,
      amount: perFlat,
      mode: mode,
      purpose: purpose,
      remarks: remarks,
    }));
    const {error} = await sb.from('collections').insert(payload);
    if(error) alert(error.message);
    else { alert(`${targetFlats.length} collection entries add ho gayi.${skipped?` (${skipped} already-existing flat(s) skipped.)`:''}`); refreshTab(); }
  });
}

async function uploadExpenseBills(files){
  const urls = [];
  for(const file of files){
    const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
    const path = `bill_${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`;
    const {error} = await sb.storage.from('expense-bills').upload(path, file, {cacheControl:'3600', upsert:false});
    if(error){ alert('Bill photo upload nahi ho paya: ' + error.message); return null; }
    const {data} = sb.storage.from('expense-bills').getPublicUrl(path);
    urls.push(data.publicUrl);
  }
  return urls;
}
// bill_url stores one or more URLs joined by \n (no schema change needed)
function billLinksHtml(billUrl){
  const urls = (billUrl||'').split('\n').filter(Boolean);

  return urls.map((u,i)=>`<a href="${u}" target="_blank" class="config-note" style="margin:0;">📎 બિલ${urls.length>1?' '+(i+1):''}</a>`).join('');
}

function editCharge(roundName){
  const c = chargeRoundsCache.find(x=>x.round_name===roundName);
  if(!c) return;
  openAccordion('acc_charges');
  editingChargeRoundName = roundName;
  document.getElementById('ch_name').value = c.round_name;
  document.getElementById('ch_amount').value = c.amount_per_flat ?? '';
  document.getElementById('ch_applies').value = c.applies_to || 'All Flats';
  document.getElementById('ch_date').value = c.date_started || '';
  document.getElementById('charges-form-title').textContent = `Editing "${roundName}"`;
  document.getElementById('ch_name').scrollIntoView({behavior:'smooth', block:'center'});
}
function resetChargeForm(){
  editingChargeRoundName = null;
  ['ch_name','ch_amount','ch_date'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('ch_applies').value = 'All Flats';
  document.getElementById('charges-form-title').textContent = 'Add Charge Round';
}
async function addCharge(){
  await withPin(async ()=>{
    const newName = document.getElementById('ch_name').value;
    const payload = {
      round_name: newName,
      amount_per_flat: Number(document.getElementById('ch_amount').value),
      applies_to: document.getElementById('ch_applies').value,
      date_started: document.getElementById('ch_date').value || null,
    };
    if(editingChargeRoundName && editingChargeRoundName !== newName){
      // Renaming a round: insert the new name first, repoint every collection
      // entry to it, then remove the old name — this order never leaves a
      // collections.purpose value pointing at a round_name that doesn't exist.
      const insertRes = await sb.from('charges').insert(payload);
      if(insertRes.error){ alert(insertRes.error.message); return; }
      const moveRes = await sb.from('collections').update({purpose: newName}).eq('purpose', editingChargeRoundName);
      if(moveRes.error){ alert('Round renamed, lekin collections entries move karte waqt error: ' + moveRes.error.message); return; }
      const deleteRes = await sb.from('charges').delete().eq('round_name', editingChargeRoundName);
      if(deleteRes.error){ alert('Warning: purani round "' + editingChargeRoundName + '" delete nahi ho payi: ' + deleteRes.error.message); }
      editingChargeRoundName = null; refreshTab(); return;
    }
    const {error} = editingChargeRoundName
      ? await sb.from('charges').update(payload).eq('round_name', editingChargeRoundName)
      : await sb.from('charges').insert(payload);
    if(error) alert(error.message); else { editingChargeRoundName = null; refreshTab(); }
  });
}

/* ---- Sticker Log tab ---- */
let vehiclesByFlatCache = [];
let firstIssuedVehicles = new Set();
let lastStickerFlat = null;
async function renderStickerLogTab(box){
  const [{data, error}, {data:flats}, {data:allVehicles}, {data:firstIssued}] = await Promise.all([
    sb.from('sticker_log').select('*').order('log_date',{ascending:false}).order('id',{ascending:false}),
    sb.from('flats').select('flat_no, owner_name').order('flat_no'),
    sb.from('vehicles').select('flat_no, vehicle_number, vehicle_type').order('flat_no'),
    sb.from('sticker_log').select('vehicle_number').eq('reason','First Issue')
  ]);
  vehiclesByFlatCache = allVehicles || [];
  firstIssuedVehicles = new Set((firstIssued||[]).map(r=>(r.vehicle_number||'').toUpperCase()));
  const vehicleTypeFor = (vnum) => {
    const v = vehiclesByFlatCache.find(x => (x.vehicle_number||'').toUpperCase() === (vnum||'').toUpperCase());
    return v ? v.vehicle_type : null;
  };
  // group entries by flat, like the Vehicles tab, so flat/date info isn't repeated per row
  const byFlat = {};
  (data||[]).forEach(s=>{
    if(!byFlat[s.flat_no]) byFlat[s.flat_no] = { flat_no:s.flat_no, entries:[] };
    byFlat[s.flat_no].entries.push(s);
  });
  const groups = Object.values(byFlat).sort((a,b)=>a.flat_no-b.flat_no);
  groups.forEach(g=> g.entries.sort((a,b)=>{
    const ta = vehicleTypeFor(a.vehicle_number) === 'Four Wheeler' ? 0 : 1;
    const tb = vehicleTypeFor(b.vehicle_number) === 'Four Wheeler' ? 0 : 1;
    if(ta !== tb) return ta - tb;
    return b.log_date.localeCompare(a.log_date);
  }));
  box.innerHTML = `
    <div class="card">
      <div class="accordion-header" onclick="toggleAccordion('acc_stickerlog')">
        <h3>Add Sticker Log Entry</h3>
        <span class="accordion-caret" id="acc_stickerlog_caret">▾</span>
      </div>
      <div class="accordion-body" id="acc_stickerlog_body" style="display:none; margin-top:12px;">
      <div class="form-row">
        <div class="field"><label>Date</label><input id="s_date" type="date"></div>
        <div class="field"><label>Flat No</label>
          <select id="s_flat" onchange="onStickerFlatChange()">${(flats||[]).map(f=>`<option value="${f.flat_no}">${f.flat_no}${f.owner_name?' — '+f.owner_name:''}</option>`).join('')}</select>
        </div>
        <div class="field"><label>Vehicle Number</label><select id="s_vnum" onchange="updateReasonOptions()"></select></div>
        <div class="field"><label>Reason</label>
          <select id="s_reason"></select>
        </div>
        <div class="field" style="flex:0"><button class="primary" onclick="addStickerLog()">Add</button></div>
      </div>
      ${error?`<div class="msg error">${error.message}</div>`:''}
      </div>
    </div>
    ${groups.length ? groups.map(g=>`
    <div class="card floor-card" style="text-align:center;">
      <span class="pill flat-chip" style="background:${flatBadgeColor(g.flat_no)}; font-size:22px; padding:6px 22px;">${g.flat_no}</span>
      ${g.entries.map(s=>{
        const t = vehicleTypeFor(s.vehicle_number);
        const typeClass = t==='Two Wheeler' ? 'type-two' : t==='Four Wheeler' ? 'type-four' : '';
        return `<div class="flat-entry">
            ${t ? `<img src="${t==='Two Wheeler'?ICON_BIKE:ICON_CAR}" alt="" style="height:20px;">` : ''}
            <span class="mono vnum ${typeClass}" style="font-size:13.5px;">${fmtVehicleNumber(s.vehicle_number)}</span>
            <span class="mono config-note" style="margin:0">${fmtDate(s.log_date)}</span>
            ${(s.reason==='Shared Pass' || (s.reason||'').startsWith('No Separate Sticker'))
              ? `<span class="pill" style="background:#B45309; color:#fff; border-color:#B45309; font-weight:700; font-size:11px;">⚠ ${s.reason}</span>`
              : `<span class="config-note" style="margin:0">${s.reason||''}</span>`}
            <span class="flat-actions">
              <button class="danger" onclick="deleteRow('sticker_log','id',${s.id})" title="Delete">🗑️</button>
            </span>
          </div>`;
      }).join('')}
    </div>`).join('') : `<div class="card"><p class="empty">હજુ કોઈ એન્ટ્રી નથી.</p></div>`}`;
  if(lastStickerFlat && (flats||[]).some(f=>String(f.flat_no)===String(lastStickerFlat))){
    document.getElementById('s_flat').value = lastStickerFlat;
  }
  onStickerFlatChange();
}
function onStickerFlatChange(){
  const flatSel = document.getElementById('s_flat');
  const vnumSel = document.getElementById('s_vnum');
  if(!flatSel || !vnumSel) return;
  const flatNo = Number(flatSel.value);
  const matches = vehiclesByFlatCache.filter(v => v.flat_no === flatNo);
  vnumSel.innerHTML = matches.length
    ? matches.map(v=>`<option value="${v.vehicle_number}">${fmtVehicleNumber(v.vehicle_number)} — ${v.vehicle_type==='Two Wheeler'?'2-Wheeler':'4-Wheeler'}</option>`).join('')
    : `<option value="">આ ફ્લેટ માટે કોઈ વાહન નોંધાયેલ નથી</option>`;
  updateReasonOptions();
}
function updateReasonOptions(){
  const vnumSel = document.getElementById('s_vnum');
  const reasonSel = document.getElementById('s_reason');
  if(!vnumSel || !reasonSel) return;
  const selectedVnum = (vnumSel.value||'').toUpperCase();
  const alreadyIssued = selectedVnum && firstIssuedVehicles.has(selectedVnum);
  const options = [];
  if(!alreadyIssued) options.push('First Issue');
  options.push('Replacement - Lost', 'Replacement - Damaged', 'Shared Pass', 'No Separate Sticker (Owns 2 Four Wheeler)', 'Other');
  reasonSel.innerHTML = options.map(o=>`<option>${o}</option>`).join('');
}
async function addStickerLog(){
  const vehicleNumber = document.getElementById('s_vnum').value.toUpperCase().trim();
  const reason = document.getElementById('s_reason').value || null;
  if(reason === 'First Issue' && firstIssuedVehicles.has(vehicleNumber)){
    alert('This vehicle already has a First Issue sticker on record. Pick a Replacement reason instead.');
    return;
  }
  await withPin(async ()=>{
    lastStickerFlat = document.getElementById('s_flat').value;
    const payload = {
      log_date: document.getElementById('s_date').value || new Date().toISOString().slice(0,10),
      flat_no: Number(document.getElementById('s_flat').value),
      vehicle_number: vehicleNumber,
      reason: reason,
    };
    const {error} = await sb.from('sticker_log').insert(payload);
    if(error) alert(error.message); else refreshTab();
  });
}

      </div>
      <p class="config-note" style="margin-top:8px; margin-bottom:0;">ફ્લેટ સિલેક્ટ કરો, પછી "Send Reminders" દબાવો — એક પછી એક દરેક ફ્લેટનું WhatsApp ખુલશે, tap કરો અને આગલું આપોઆપ આવશે. WhatsApp કોઈપણ વેબસાઈટને એકસાથે બધાને મોકલવાની પરવાનગી નથી આપતું, એટલે આ સૌથી ઝડપી રીત છે.</p>

function duesReminderMsg(flatNo, f, roundNames){
  const lines = roundNames.filter(r=>Number(f.perRound[r]||0)>0)
    .map(r=>`🧾 ${r}: ${fmtMoney(f.perRound[r])}`).join('\n');
  return `🙏 નમસ્તે ${f.owner_name||''},\n\nઆપની *Flat ${flatNo}* માટે મેન્ટેનન્સની નીચે મુજબ રકમ બાકી છે:\n\n💰 કુલ બાકી રકમ: ${fmtMoney(f.total)}\n${lines?lines+'\n':''}\nકૃપા કરી વહેલી તકે ચુકવણી કરવા વિનંતી છે 🙏🏻\n\n🏢 *C-Wing Society Maintenance*`;
}
function duesByFloorHtml(flatNos, byFlat, roundNames){
  const groups = {};
  flatNos.forEach(fn=>{
    const floor = Math.floor(fn/100);
    (groups[floor] = groups[floor] || []).push(fn);
  });
  const floorKeys = Object.keys(groups).map(Number).sort((a,b)=>a-b);
  return floorKeys.map(fk=>{
    const fns = groups[fk];
    const floorTotal = fns.reduce((s,fn)=>s+byFlat[fn].total, 0);
    return `<div class="card floor-card">
      <h3 class="floor-heading-center">🏢 Floor ${fk} <span class="config-note" style="display:inline; font-weight:600; margin-left:6px;">${fmtMoney(floorTotal)} pending</span></h3>
      ${fns.map(fn=>{
        const f = byFlat[fn];
        const breakdown = roundNames.filter(r=>Number(f.perRound[r]||0)>0)
          .map(r=>`<span class="config-note" style="margin:0;">${r}: ${fmtMoney(f.perRound[r])}</span>`).join('');
        const link = (f.total>0 && f.owner_name) ? waLink(f.contact_no, duesReminderMsg(fn, f, roundNames)) : null;
        const waKey = `dues:${fn}:${Math.round(f.total)}`;
        const pillId = `dues-wa-${fn}`;
        if(link) duesReminderLinks[fn] = {flatNo:fn, link, waKey, pillId};
        return `<div class="flat-entry" style="flex-direction:column; align-items:stretch; gap:4px;">
          <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
            ${link ? `<input type="checkbox" class="dues-select-cb" data-flat="${fn}" onchange="toggleDuesSelect(${fn}, this.checked)" style="width:20px; height:20px; accent-color:var(--maroon); flex-shrink:0;">` : ''}
            <span class="pill flat-chip" style="background:${flatBadgeColor(fn)}">${fn}</span>
            <span class="owner-name" style="flex:1 1 100px; min-width:0;">${f.owner_name || '<span class="config-note" style="margin:0">કોઈ માલિક નથી</span>'}</span>
            <span class="mono" style="font-weight:800; font-size:15.5px; color:${f.total>0?'var(--danger)':'#15803D'};">${fmtMoney(f.total)}</span>
          </div>
          ${link ? `<div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding-left:2px;"><a href="${link}" target="_blank" class="btn" style="text-decoration:none; display:inline-flex; align-items:center" onclick="return openWaLink(event,'${link}','${waKey}','${pillId}')">${WA_ICON}Remind</a>${waSentPillHtml(waKey, pillId)}</div>` : ''}
          ${breakdown ? `<div style="display:flex; gap:10px; flex-wrap:wrap; padding-left:2px;">${breakdown}</div>` : ''}
        </div>`;
      }).join('')}
    </div>`;
  }).join('');
}

/* ---- Dues Summary bulk reminders — select flats, then work through
   their WhatsApp chats one at a time. WhatsApp gives no way for a
   website to message multiple contacts in one go, so this is a
   guided queue: each tap opens the next flat's chat and auto-advances,
   instead of making the admin scroll and hunt for each flat manually. */
function toggleDuesSelect(flatNo, checked){
  if(checked) duesSelected.add(flatNo); else duesSelected.delete(flatNo);
  updateDuesSelectToolbar();
}
function selectAllPendingDues(){
  Object.keys(duesReminderLinks).forEach(fn=> duesSelected.add(Number(fn)));
  document.querySelectorAll('.dues-select-cb').forEach(cb=> cb.checked = true);
  updateDuesSelectToolbar();
}
function clearDuesSelection(){
  duesSelected.clear();
  document.querySelectorAll('.dues-select-cb').forEach(cb=> cb.checked = false);
  updateDuesSelectToolbar();
}
function updateDuesSelectToolbar(){
  const el = document.getElementById('dues-select-count');
  if(el) el.textContent = `${duesSelected.size} flat(s) selected`;
}
function sendSelectedDuesReminders(){
  if(!duesSelected.size){ alert('Pehle kam se kam ek flat select karo.'); return; }
  withPin(async ()=>{
    const items = [...duesSelected].map(fn=>duesReminderLinks[fn]).filter(Boolean);
    startWaQueue(items);
  });
}
let waQueue = [];
let waQueueIndex = 0;
function startWaQueue(items){
  waQueue = items;
  waQueueIndex = 0;
  showWaQueueModal();
}
function showWaQueueModal(){
  const old = document.getElementById('wa-queue-modal');
  if(old) old.remove();
  if(waQueueIndex >= waQueue.length){
    const done = waQueue.length;
    waQueue = []; waQueueIndex = 0;
    if(done){ alert(`✅ ${done} flat(s) ka reminder process complete ho gaya.`); refreshTab(); }
    return;
  }
  const item = waQueue[waQueueIndex];
  const overlay = el(`<div class="modal-backdrop" id="wa-queue-modal">
    <div class="modal-box">
      <h3>Reminder ${waQueueIndex+1} / ${waQueue.length}</h3>
      <p class="config-note">Flat ${item.flatNo} નું WhatsApp ખોલવા માટે નીચે બટન દબાવો — મોકલ્યા પછી આગલો ફ્લેટ આપોઆપ આવશે.</p>
      <div class="modal-actions" style="justify-content:space-between;">
        <button onclick="skipWaQueue()">Skip</button>
        <a href="${item.link}" target="_blank" class="btn primary" style="text-decoration:none;" onclick="return sendWaQueueItem()">${WA_ICON}Flat ${item.flatNo} ko bhejo</a>
      </div>
      <div class="modal-actions">
        <button onclick="closeWaQueueModal()">Close</button>
      </div>
    </div>
  </div>`);
  document.body.appendChild(overlay);
}
function sendWaQueueItem(){
  const item = waQueue[waQueueIndex];
  window.open(item.link, '_blank');
  setWaSent(item.waKey, true);
  waQueueIndex++;
  showWaQueueModal();
  return false;
}
function skipWaQueue(){ waQueueIndex++; showWaQueueModal(); }
function closeWaQueueModal(){ document.getElementById('wa-queue-modal')?.remove(); waQueue = []; waQueueIndex = 0; }

      <div class="field" style="margin-top:10px; max-width:260px;">
        <select id="set_default_tab" onchange="setDefaultTab(this.value)">
          ${ADMIN_TABS.map(([k,label])=>`<option value="${k}" ${getDefaultTab()===k?'selected':''}>${label}</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="card">
      <h3>🔁 Add Collection Auto-fill</h3>
      <p class="config-note" style="margin-top:-6px">Purpose (Round) select karte hi Amount apne aap us round ke "Amount per Flat" se bhar jaye.</p>
      <label style="display:flex; align-items:center; gap:10px; margin-top:10px; cursor:pointer;">
        <input type="checkbox" id="set_autofill_toggle" ${autofillEnabled()?'checked':''} onchange="toggleAutofillSetting(this.checked)" style="width:20px; height:20px; accent-color:var(--maroon); flex-shrink:0;">
        <span>Auto-fill enable rakho</span>
      </label>
    </div>
    <div class="card">
      <h3>ℹ️ Jaankari</h3>
      <p class="config-note" style="margin:0;">Ye sabhi settings sirf isi device/browser par lagu hoti hain — koi bhi Supabase data ya doosre kisi device ki setting nahi badalti.</p>
    </div>`;
}

/* ---- generic delete (with a proper styled confirm popup) ---- */
function showConfirmModal(message, onYes){
  const old = document.getElementById('confirm-modal');
  if(old) old.remove();
  const overlay = el(`<div class="modal-backdrop" id="confirm-modal">
    <div class="modal-box">
      <h3>Are you sure?</h3>
      <p>${message}</p>
      <div class="modal-actions">
        <button onclick="document.getElementById('confirm-modal').remove()">Cancel</button>
        <button class="danger" id="confirm-modal-yes">Yes, delete</button>
      </div>
    </div>
  </div>`);
  document.body.appendChild(overlay);
  document.getElementById('confirm-modal-yes').onclick = async ()=>{
    overlay.remove();
    await onYes();
  };
}
async function deleteRow(table, col, val, isString){
  await withPin(async ()=>{
    showConfirmModal('This will permanently delete this row. This cannot be undone.', async ()=>{
      const {error} = await sb.from(table).delete().eq(col, val);
      if(error) { alert(error.message); return; }
      // clean up the matching WhatsApp Sent/Pending row so stale
      // status entries don't pile up in wa_sent after deletes
      if(table === 'collections') await setWaSent(`collection:${val}`, false);
      if(table === 'expenses') await setWaSent(`expense:${val}:group`, false);
      refreshTab();
    });
  });
}

/* ---------------- boot ---------------- */
(async ()=>{
  if(pinStillValid()){
    const {data:{session}} = await sb.auth.getSession();
    if(session){ state.user = session.user; }
    else { localStorage.removeItem(PIN_UNLOCK_KEY); } // stale flag, session actually gone
  }
  state.tab = getDefaultTab();
  render();
  if(notifEnabled()){
    await ensureNotifBaseline();
    refreshNotifBadge();
    startNotifPolling();
  }
})();
if('serviceWorker' in navigator && location.protocol !== 'file:'){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}
</script>
