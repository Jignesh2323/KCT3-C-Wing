<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C-Wing — Maintenance Khata</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ============================================================
   DESIGN SYSTEM — clean, flat, mobile-first. Same class names
   as before throughout the JS, only the visual language changed,
   so no markup/logic had to move.
   Palette: cool light surface, indigo primary, soft tinted
   status chips (green/red/amber/blue) instead of ledger colors.
   Type: Space Grotesk (headings) + Inter (UI/body) + IBM Plex
   Mono (money, vehicle numbers, dates — anything tabular).
   ============================================================ */
:root{
  --paper:#F3F4F8;
  --paper-dark:#E9EBF3;
  --ink:#14162B;
  --ink-soft:#6B7280;
  --maroon:#4F46E5;
  --maroon-dark:#3D34C9;
  --ledger-green:#16A34A;
  --rule:#E4E6EF;
  --white-card:#FFFFFF;
  --danger:#DC2626;
  --warning:#B45309;
  --info:#0369A1;
  --maroon-glow:rgba(79,70,229,.28);
  --radius:18px;
  --radius-sm:12px;
  --shadow:0 1px 2px rgba(20,22,43,.04), 0 8px 24px rgba(20,22,43,.07);
  --shadow-lg:0 4px 10px rgba(20,22,43,.08), 0 16px 40px rgba(20,22,43,.14);
  --nav-h:64px;
}
*{box-sizing:border-box;}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:'Inter',sans-serif; font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
h1,h2,h3{font-family:'Space Grotesk',sans-serif; font-weight:700; margin:0 0 .3em; letter-spacing:-.01em;}
.mono{font-family:'IBM Plex Mono',monospace;}
.app{max-width:920px; margin:0 auto; padding:16px; padding-bottom:calc(var(--nav-h) + 28px + env(safe-area-inset-bottom));}

.hero-banner{
  position:relative;
  margin:-16px -16px 20px;
  background:linear-gradient(135deg, #3730A3 0%, var(--maroon) 60%, #6D28D9 100%);
  display:flex; align-items:flex-start; justify-content:space-between; gap:12px; flex-wrap:wrap;
  padding:18px 20px 16px;
}
.hero-banner .title-block{display:flex; flex-direction:column; gap:3px; min-width:0;}
.hero-banner .eyebrow{
  color:rgba(255,255,255,.75); font-size:11px; font-weight:700;
  letter-spacing:.14em; text-transform:uppercase;
}
.hero-banner h1{
  color:#fff; font-size:21px; font-weight:700; margin:0; letter-spacing:-.01em; line-height:1.2;
}
.hero-banner .who{display:flex; flex-direction:column-reverse; align-items:flex-end; gap:8px; font-size:13px; flex-shrink:0; margin-left:auto;}
.hero-banner .who button.primary{background:#fff; color:var(--maroon); border-color:#fff; box-shadow:0 2px 10px rgba(20,22,43,.2);}
.hero-banner .who button.primary:hover{background:#F3F4F8; border-color:#F3F4F8;}
.hero-banner .who button:not(.primary){background:rgba(255,255,255,.15); color:#fff; border-color:rgba(255,255,255,.4);}
.hero-banner .who button:not(.primary):hover{background:rgba(255,255,255,.25);}

button, .btn{
  font-family:'Inter',sans-serif; font-size:13.5px; font-weight:600;
  border:1.5px solid var(--rule); background:var(--white-card); color:var(--ink);
  padding:11px 18px; min-height:44px; border-radius:var(--radius-sm); cursor:pointer;
  transition:transform .1s ease, box-shadow .15s ease, background .15s ease, border-color .15s ease;
}
button:hover{border-color:#C7CAD9; background:var(--paper-dark);}
button:active{transform:scale(.97);}
button.primary{background:var(--maroon); color:#fff; border-color:var(--maroon); box-shadow:0 4px 14px var(--maroon-glow);}
button.primary:hover{background:var(--maroon-dark); border-color:var(--maroon-dark); box-shadow:0 6px 18px var(--maroon-glow);}
button.danger{border-color:#FCC; color:var(--danger); background:#FEF2F2;}
button.danger:hover{background:var(--danger); color:#fff; border-color:var(--danger);}

input, select, textarea{
  font-family:'Inter',sans-serif; font-size:15px; padding:11px 13px; min-height:44px;
  border:1.5px solid var(--rule); border-radius:var(--radius-sm); background:var(--white-card); color:var(--ink);
}
input:focus, select:focus, textarea:focus{outline:none; border-color:var(--maroon); box-shadow:0 0 0 3px rgba(79,70,229,.14);}
label{font-size:12px; color:var(--ink-soft); display:block; margin-bottom:6px; font-weight:600; letter-spacing:.01em;}
.field{margin-bottom:12px;}
.card{
  background:var(--white-card); border:1px solid var(--rule); border-radius:var(--radius);
  padding:20px; margin-bottom:18px; box-shadow:var(--shadow); overflow-x:auto;
}
.card h3{font-size:16.5px; margin-bottom:.5em;}
.grid-stats{display:flex; flex-wrap:wrap; gap:10px;}
.stat{border-radius:var(--radius-sm); padding:13px 16px; background:var(--paper-dark); flex:0 0 auto; border:1px solid rgba(20,22,43,.03); transition:transform .15s ease;}
.stat .num{font-family:'IBM Plex Mono',monospace; font-size:21px; font-weight:700; color:var(--ink);}
.stat .lbl{font-size:11px; font-weight:600; color:var(--ink-soft); margin-top:3px; letter-spacing:.01em;}
.lbl-icon{font-size:17px; margin-right:5px; vertical-align:-3px; display:inline-block;}
.stat-good{background:#ECFDF3;} .stat-good .num{color:#15803D;}
.stat-bad{background:#FEF2F2;} .stat-bad .num{color:#B91C1C;}
.stat-neutral{background:#EEF2FF;} .stat-neutral .num{color:#3730A3;}
.stat-info{background:#F0F9FF;} .stat-info .num{color:#0369A1;}
.stat-warning{background:#FFFBEB;} .stat-warning .num{color:#B45309;}
.stat-two{background:#ECFEFF;} .stat-two .num{color:#0E7490;}
.stat-four{background:#FEF2F2;} .stat-four .num{color:#B91C1C;}
.stat-cash{background:#FFFBEB;} .stat-cash .num{color:#B45309;}
.stat-bank{background:#EFF6FF;} .stat-bank .num{color:#1D4ED8;}
table{width:100%; border-collapse:collapse; font-size:13.5px;}
th{
  text-align:left; padding:9px 10px; white-space:nowrap;
  font-family:'Inter',sans-serif; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em;
  background:var(--paper-dark); color:var(--ink-soft); font-weight:700;
}
td{padding:9px 10px; border-bottom:1px solid var(--rule);}
tr:hover td{background:var(--paper-dark);}
.v-input{color:#1D4ED8;}
.v-formula{color:var(--ink);}
.floor-1{background:#FBEAEA;} .floor-1 .contact{color:#B33A2E;}
.floor-2{background:#EAF1FB;} .floor-2 .contact{color:#1D5FA8;}
.floor-3{background:#EDF6EA;} .floor-3 .contact{color:#3E8C2E;}
.floor-4{background:#FCEFE4;} .floor-4 .contact{color:#B35A18;}
.floor-5{background:#F0EBF8;} .floor-5 .contact{color:#5D3EA8;}
.floor-6{background:#FFF8E3;} .floor-6 .contact{color:#B3860A;}
.floor-7{background:#E7F3F4;} .floor-7 .contact{color:#207E8F;}
.floor-8{background:#FBE9E9;} .floor-8 .contact{color:#B32626;}
.floor-9{background:#E9F1FA;} .floor-9 .contact{color:#1D5FA8;}
.floor-10{background:#EBF6E7;} .floor-10 .contact{color:#3E9B2E;}
.floor-11{background:#FCEEE6;} .floor-11 .contact{color:#B34B18;}
.floor-12{background:#F5E9F0;} .floor-12 .contact{color:#A82368;}
.floor-13{background:#E9F5E9;} .floor-13 .contact{color:#278A22;}
.floor-x:hover td,[class*="floor-"]:hover td{filter:brightness(0.97);}
.veh-two{background:#E7F8F8;}
.veh-four{background:#FBE9E8;}
.mobile{font-weight:700; font-size:16px; letter-spacing:.01em;}
.owner-name{font-weight:700;}
.flat-no{font-weight:800; font-size:17px;}
.search-safe{
  background:#ECFDF3 !important;
  border:1.5px solid var(--ledger-green) !important;
  font-weight:600;
}
.search-safe::placeholder{color:#4E9F6B;}
.search-safe-label{color:var(--ledger-green) !important; font-weight:700;}
.vnum{font-weight:700; font-size:16.5px; letter-spacing:.03em;}
.type-two{color:#0E7490; font-weight:600;}
.type-four{color:#B91C1C; font-weight:600;}
.modal-backdrop{
  position:fixed; inset:0; background:rgba(20,22,43,.5); display:flex; align-items:center; justify-content:center; z-index:1000; padding:16px;
}
.modal-box{
  background:var(--white-card); border:1px solid var(--rule); border-radius:18px; padding:22px 24px;
  max-width:360px; width:100%; box-shadow:var(--shadow-lg);
}
.modal-box h3{margin-bottom:10px;}
.modal-actions{display:flex; gap:10px; justify-content:flex-end; margin-top:16px;}

/* ---- Bottom navigation bar (mobile-app style) ---- */
.bottom-nav{
  position:fixed; left:0; right:0; bottom:0; z-index:60;
  max-width:920px; margin:0 auto;
  display:flex; align-items:stretch;
  background:rgba(255,255,255,.97); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  border-top:1px solid var(--rule); box-shadow:var(--shadow-lg);
  padding:6px 6px calc(6px + env(safe-area-inset-bottom));
}
.nav-item{
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  padding:6px 2px; border-radius:var(--radius-sm); cursor:pointer; position:relative;
  font-family:'Inter',sans-serif; font-size:10.5px; font-weight:600; color:var(--ink-soft);
  background:none; border:none; -webkit-tap-highlight-color:transparent; transition:color .15s ease;
}
.nav-item .nav-icon{
  font-size:20px; line-height:1; width:34px; height:26px; display:flex; align-items:center; justify-content:center;
  border-radius:10px; transition:background .15s ease, transform .15s ease;
}
.nav-item .nav-label{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%;}
.nav-item.active{color:var(--maroon);}
.nav-item.active .nav-icon{background:#EEF2FF; transform:translateY(-1px);}
.nav-more{position:relative;}
.more-menu{
  position:absolute; bottom:calc(100% + 12px); right:-6px; min-width:190px;
  background:var(--white-card); border:1px solid var(--rule); border-radius:14px;
  box-shadow:var(--shadow-lg); padding:6px; z-index:70;
  display:none; flex-direction:column; gap:2px;
}
.more-menu.open{display:flex;}
.more-menu-item{
  display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px;
  font-family:'Inter',sans-serif; font-size:13.5px; font-weight:600; color:var(--ink);
  cursor:pointer; text-align:left; white-space:nowrap;
}
.more-menu-item .nav-icon{font-size:16px; width:auto; height:auto; background:none;}
.more-menu-item:hover{background:var(--paper-dark);}
.more-menu-item.active{background:#EEF2FF; color:var(--maroon);}
.form-row{display:flex; gap:10px; flex-wrap:wrap; align-items:end; margin-bottom:16px;}
.form-row .field{flex:1; min-width:140px; margin-bottom:0;}
.msg{padding:10px 14px; border-radius:10px; margin-bottom:14px; font-size:13.5px;}
.msg.error{background:#FEF2F2; border:1px solid #FCC; color:var(--danger);}
.msg.ok{background:#ECFDF3; border:1px solid #BBF0D0; color:#15803D;}
.empty{color:var(--ink-soft); font-style:italic; padding:14px 0;}
.pill{
  font-family:'Inter',sans-serif; font-weight:600; font-size:11.5px; padding:3px 10px; border-radius:999px;
  border:1.5px solid currentColor; display:inline-block;
}
.pill.sold{color:#15803D; background:#ECFDF3;}
.pill.unsold{color:var(--ink-soft); background:var(--paper-dark);}
.pill-select{
  font-family:'Inter',sans-serif; font-weight:600; font-size:11.5px; padding:3px 8px; border-radius:999px;
  border:1.5px solid currentColor; background:transparent; cursor:pointer;
}
.pill-select.sold{color:#15803D;}
.pill-select.unsold{color:var(--ink-soft);}
.config-note{font-size:12px; color:var(--ink-soft); margin-top:6px;}
a{color:var(--maroon);}

@media (max-width:600px){
  .app{padding:12px; padding-bottom:calc(var(--nav-h) + 20px + env(safe-area-inset-bottom));}
  .hero-banner{margin:-12px -12px 16px; padding:16px 14px 14px;}
  .hero-banner h1{font-size:18px;}
  .hero-banner .eyebrow{font-size:10px;}
  .card{padding:14px; border-radius:14px;}
  .stat{padding:10px 13px;}
  .stat .num{font-size:19px;}
  th, td{padding:8px 8px; font-size:12.5px;}
  .form-row{flex-direction:column; align-items:stretch; gap:12px;}
  .form-row .field{width:100%; min-width:0;}
  .form-row .field[style*="flex:0"]{width:100%;}
  .form-row button{width:100%;}
}
</style>
</head>

/* ---- WhatsApp "sent / pending" tracking (saved on this device only) ----
   Lets you know who you've already WhatsApp'd for a given collection
   entry or expense-notify round, and who's still left. Auto-marks a
   flat as Sent the moment you tap the WhatsApp button; you can also
   tap the pill itself to flip it back to Pending (e.g. if you sent it
   by mistake, or want to re-send). */
let waSentCache = {};
async function loadWaSentCache(){
  const {data} = await sb.from('wa_sent').select('entity_key');
  waSentCache = {};
  (data||[]).forEach(r=> waSentCache[r.entity_key] = true);
}
function isWaSent(key){ return !!waSentCache[key]; }
async function setWaSent(key, val){
  if(val) waSentCache[key] = true; else delete waSentCache[key];
  const {error} = val
    ? await sb.from('wa_sent').upsert({entity_key: key, sent: true, updated_at: new Date().toISOString()})
    : await sb.from('wa_sent').delete().eq('entity_key', key);
  if(error) alert(error.message);
}
function waSentPillHtml(key, pillId){
  const sent = isWaSent(key);
  return `<span id="${pillId}" class="pill ${sent?'sold':'unsold'}" style="cursor:pointer; margin-left:4px" title="Tap to toggle Sent/Pending (PIN needed)" onclick="toggleWaSentPill('${key}','${pillId}')">${sent?'✓ Sent':'Pending'}</span>`;
}
function paintWaSentPill(pillId, sent){
  const p = document.getElementById(pillId);
  if(p){ p.textContent = sent ? '✓ Sent' : 'Pending'; p.classList.toggle('sold', sent); p.classList.toggle('unsold', !sent); }
}
function toggleWaSentPill(key, pillId){
  withPin(async ()=>{
    const now = !isWaSent(key);
    await setWaSent(key, now);
    paintWaSentPill(pillId, now);
  });
}
function openWaLink(event, link, key, pillId){
  event.preventDefault();
  withPin(async ()=>{
    window.open(link, '_blank');
    await setWaSent(key, true);
    paintWaSentPill(pillId, true);
  });
  return false;
}

function flatBadgeColor(flatNo){
  // golden-angle hue spacing spreads colors maximally around the wheel
  // so adjacent flat numbers never land on similar-looking hues.
  const n = Number(flatNo) || 0;
  const hue = (n * 137.508) % 360;
  const sat = 58 + (n % 3) * 8;   // 58/66/74 — small variation so even same-hue wraps differ
  const light = 38 + (n % 2) * 6; // 38/44
  return `hsl(${hue.toFixed(1)}, ${sat}%, ${light}%)`;
}

/* ---- Monthly Common Expense Split ---- */
const COMMON_EXPENSE_CATEGORIES = ['Security','Housekeeping','Electricity','Water','Lift Maintenance','Repair & Maintenance','Gardening','Pest Control','Admin/Stationery'];
const TOTAL_FLATS_FIXED = 52;
let cxMonth = new Date().getMonth()+1;
let cxYear = new Date().getFullYear();

function cxMonthOptionsHtml(){
  return ['January','February','March','April','May','June','July','August','September','October','November','December']
    .map((name,i)=>`<option value="${i+1}" ${i+1===cxMonth?'selected':''}>${name}</option>`).join('');
}
function cxYearOptionsHtml(){
  const curYear = new Date().getFullYear();
  const opts = [];
  for(let y=curYear-3; y<=curYear+1; y++) opts.push(`<option value="${y}" ${y===cxYear?'selected':''}>${y}</option>`);
  return opts.join('');
}
function onCxDateChange(){
  cxMonth = Number(document.getElementById('cx_month').value);
  cxYear = Number(document.getElementById('cx_year').value);
  renderCommonExpenseSplit();
}
async function renderCommonExpenseSplit(){
  const resultBox = document.getElementById('cx_result');
  if(!resultBox) return;
  resultBox.innerHTML = 'Loading...';
  const startDate = `${cxYear}-${String(cxMonth).padStart(2,'0')}-01`;
  const endDate = cxMonth===12 ? `${cxYear+1}-01-01` : `${cxYear}-${String(cxMonth+1).padStart(2,'0')}-01`;
  const [{data:exp, error:expErr}, {data:flats, error:flatsErr}] = await Promise.all([
    sb.from('expenses').select('amount').in('category', COMMON_EXPENSE_CATEGORIES).gte('expense_date', startDate).lt('expense_date', endDate),
    sb.from('v_flats').select('status')
  ]);
  if(expErr || flatsErr){
    resultBox.innerHTML = `<div class="msg error">${(expErr||flatsErr).message}</div>`;
    return;
  }
  const total = (exp||[]).reduce((sum,e)=>sum+Number(e.amount||0),0);
  const perFlat = total / TOTAL_FLATS_FIXED;
  const soldCount = (flats||[]).filter(f=>f.status==='Sold').length;
  const unsoldCount = (flats||[]).filter(f=>f.status==='Unsold').length;
  const soldTotal = perFlat * soldCount;
  const unsoldTotal = perFlat * unsoldCount;
  resultBox.innerHTML = `
    <div class="grid-stats">
      <div class="stat stat-bad"><div class="num mono">${fmtMoney(total)}</div><div class="lbl">Month Total (Common Categories)</div></div>
      <div class="stat stat-neutral"><div class="num mono">${fmtMoney(perFlat)}</div><div class="lbl">Per Flat (÷${TOTAL_FLATS_FIXED})</div></div>
      <div class="stat stat-good"><div class="num mono">${soldCount}</div><div class="lbl">Sold Flats Count</div></div>
      <div class="stat stat-good"><div class="num mono">${fmtMoney(soldTotal)}</div><div class="lbl">Sold Flats Total</div></div>
      <div class="stat stat-warning"><div class="num mono">${unsoldCount}</div><div class="lbl">Unsold Flats Count</div></div>
      <div class="stat stat-warning"><div class="num mono">${fmtMoney(unsoldTotal)}</div><div class="lbl">Unsold Flats Total (Builder Share)</div></div>
    </div>`;
}

<script>
/* ============================================================
   ADMIN APP — PIN-gated admin panel. Everything is in this
   single file (styles + logic), nothing else to download.
   ============================================================ */
const root = document.getElementById('root');
let state = { user:null, profile:null, tab:'dashboard', msg:null };

function el(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstChild; }

/* ---------------- PIN-gated WRITE access ----------------
   Viewing (dashboard, flats, expenses, vehicle search) never
   needs a PIN — it's open to everyone, same as before.
   Only when someone tries to Add/Edit/Delete/change status,
   a PIN prompt appears. Correct PIN signs into one shared
   hidden admin account behind the scenes, unlocking writes
   ON THIS DEVICE until the "Lock" button is pressed manually. */
const HIDDEN_ADMIN_EMAIL = "cwing-admin@internal.local";
const HIDDEN_ADMIN_PASSWORD = "CwingAdmin2026";
const ADMIN_PIN = "1201";
const PIN_UNLOCK_KEY = "cwing_pin_unlocked";

function pinStillValid(){
  return localStorage.getItem(PIN_UNLOCK_KEY) === "true";
}

/* Call this from any Add/Edit/Delete/status-change handler:
     withPin(async () => { ...the actual write... });
   If already unlocked (and not expired), the action runs immediately.
   Otherwise a PIN modal appears; the action only runs after the
   correct PIN is entered and the hidden account signs in. */
async function withPin(action){
  if(pinStillValid() && state.user){ await action(); return; }
  if(state.user && !pinStillValid()){ await sb.auth.signOut(); state.user = null; }
  showPinModal(action);
}

function showPinModal(action){
  const old = document.getElementById('pin-modal');
  if(old) old.remove();
  const overlay = el(`<div class="modal-backdrop" id="pin-modal">
    <div class="modal-box">
      <h3>Enter PIN</h3>
      <p class="config-note">Needed to make changes. Stays unlocked on this device until you press Lock.</p>
      <div id="pin-modal-msg"></div>
      <input id="pin-modal-input" type="password" inputmode="numeric" maxlength="6" style="width:100%; letter-spacing:.3em; text-align:center; font-size:20px" autofocus>
      <div class="modal-actions">
        <button onclick="document.getElementById('pin-modal').remove(); render();">Cancel</button>
        <button class="primary" id="pin-modal-submit">Unlock</button>
      </div>
    </div>
  </div>`);
  document.body.appendChild(overlay);
  const submit = async ()=>{
    const pin = document.getElementById('pin-modal-input').value.trim();
    const msgBox = document.getElementById('pin-modal-msg');
    if(pin !== ADMIN_PIN){
      msgBox.innerHTML = `<div class="msg error">Wrong PIN.</div>`;
      return;
    }
    const {error} = await sb.auth.signInWithPassword({email: HIDDEN_ADMIN_EMAIL, password: HIDDEN_ADMIN_PASSWORD});
    if(error){ msgBox.innerHTML = `<div class="msg error">${error.message}</div>`; return; }
    localStorage.setItem(PIN_UNLOCK_KEY, "true");
    const {data:{session}} = await sb.auth.getSession();
    state.user = session ? session.user : null;
    overlay.remove();
    await action();
  };
  document.getElementById('pin-modal-submit').onclick = submit;
  document.getElementById('pin-modal-input').addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
}
async function lockNow(){
  await sb.auth.signOut();
  localStorage.removeItem(PIN_UNLOCK_KEY);
  state.user = null;
  if(HIDDEN_TAB_KEYS.includes(state.tab)) state.tab = 'dashboard';
  render();
}

/* Global gate: clicking/typing into ANY input box (except the two
   designated search boxes, which carry the .search-safe class)
   immediately asks for the PIN before the field can be used —
   not just when Add/Save is eventually clicked. Dropdowns
   (<select>) are left alone since choosing a value doesn't write
   anything by itself. */
document.addEventListener('focusin', (e)=>{
  const t = e.target;
  if(t.tagName === 'INPUT' && t.id !== 'pin-modal-input' && !t.classList.contains('search-safe') && !(pinStillValid() && state.user)){
    t.blur();
    showPinModal(async ()=>{ render(); });
  }
});

async function updateBulkBuilderTotal(){
  const purpose = document.getElementById('bb_purpose')?.value;
  const note = document.getElementById('bb_calc_note');
  if(!purpose || !note) return;
  const round = chargesCache.find(c=>c.round_name===purpose);
  const perFlat = Number(round?.amount_per_flat||0);
  note.textContent = 'Calculating…';
  const [{data:unsoldFlats}, {data:existing}] = await Promise.all([
    sb.from('v_flats').select('flat_no').eq('status','Unsold'),
    sb.from('collections').select('flat_no').eq('purpose', purpose)
  ]);
  const alreadyDone = new Set((existing||[]).map(c=>c.flat_no));
  const targetCount = (unsoldFlats||[]).filter(f=>!alreadyDone.has(f.flat_no)).length;
  const total = perFlat * targetCount;
  document.getElementById('bb_total').value = total || '';

async function addCollection(){
  const flatNo = Number(document.getElementById('c_flat').value);
  const purpose = document.getElementById('c_purpose').value;
  const {data: existing} = await sb.from('collections').select('*').eq('flat_no', flatNo).eq('purpose', purpose);
  if(existing && existing.length){
    const prior = existing[0];
    const proceed = confirm(`⚠ Flat ${flatNo} already has a collection entry for "${purpose}" — ${fmtMoney(prior.amount)} on ${fmtDate(prior.collection_date)}.\n\nAdd another entry for this flat + purpose anyway?`);
    if(!proceed) return;
  }
  await withPin(async ()=>{
    const payload = {
      flat_no: flatNo,
      collection_date: document.getElementById('c_date').value || new Date().toISOString().slice(0,10),
      amount: Number(document.getElementById('c_amount').value),
      mode: document.getElementById('c_mode').value,
      purpose: purpose,
      remarks: document.getElementById('c_remarks').value || null,
    };
    const {error} = await sb.from('collections').insert(payload);

async function bulkBuilderPayment(){
  const purpose = document.getElementById('bb_purpose').value;
  const date = document.getElementById('bb_date').value || new Date().toISOString().slice(0,10);
  const total = Number(document.getElementById('bb_total').value);
  const mode = document.getElementById('bb_mode').value;
  const remarks = document.getElementById('bb_remarks').value || null;
  if(!purpose){ alert('Purpose (Round) select karo.'); return; }
  if(!total || total <= 0){ alert('Valid Total Amount daalo.'); return; }

  const [{data:unsoldFlats, error:e1}, {data:existing, error:e2}] = await Promise.all([
    sb.from('v_flats').select('flat_no').eq('status','Unsold'),
    sb.from('collections').select('flat_no').eq('purpose', purpose)
  ]);
  if(e1 || e2){ alert((e1||e2).message); return; }
  if(!unsoldFlats || !unsoldFlats.length){ alert('Koi Unsold flat nahi mila.'); return; }

  const alreadyDone = new Set((existing||[]).map(c=>c.flat_no));
  const targetFlats = unsoldFlats.filter(f=>!alreadyDone.has(f.flat_no));
  const skipped = unsoldFlats.length - targetFlats.length;
  if(!targetFlats.length){ alert(`Sabhi ${unsoldFlats.length} Unsold flats ka "${purpose}" ke liye collection pehle se hi entered hai.`); return; }

  const perFlat = total / targetFlats.length;
  const proceed = confirm(`${targetFlats.length} Unsold flats me ${fmtMoney(perFlat)} per flat (total ${fmtMoney(total)}) ki entry banegi, purpose "${purpose}".${skipped?`\n${skipped} flat(s) already have an entry for this round — unhe skip kiya jayega.`:''}\n\nProceed?`);
  if(!proceed) return;

  await withPin(async ()=>{
    const payload = targetFlats.map(f=>({
      flat_no: f.flat_no,
      collection_date: date,
      amount: perFlat,
      mode: mode,
      purpose: purpose,
      remarks: remarks,
    }));
    const {error} = await sb.from('collections').insert(payload);
    if(error) alert(error.message);
    else { alert(`${targetFlats.length} collection entries add ho gayi.${skipped?` (${skipped} already-existing flat(s) skipped.)`:''}`); refreshTab(); }
  });
}

async function notifyExpenseToSoldOwners(expenseId){
  const e = expensesCache.find(x=>x.id===expenseId);
  if(!e) return;
  const [{data: soldFlats, error}] = await Promise.all([
    sb.from('v_flats').select('flat_no, owner_name, contact_no').eq('status','Sold').order('flat_no'),
    loadWaSentCache(),
  ]);
  if(error){ alert(error.message); return; }
  notifySoldFlatsCache = soldFlats || [];
  notifyExpenseCache = e;
  const old = document.getElementById('notify-modal');
  if(old) old.remove();
  const overlay = el(`<div class="modal-backdrop" id="notify-modal">
    <div class="modal-box" style="max-width:420px; max-height:80vh; overflow-y:auto;">
      <h3>Notify Sold Flat Owners</h3>
      <p class="config-note">${e.category}${e.description?' - '+e.description:''} — ${fmtMoney(e.amount)}. Har owner ke liye alag WhatsApp chat khulega — Send khud dabana padega (free tarike se ek saath auto-bhejna WhatsApp par possible nahi hai).</p>
      <p id="notify-progress" class="config-note" style="font-weight:700; color:var(--maroon)"></p>
      <div id="notify-rows-box"></div>
      <div class="modal-actions" style="justify-content:space-between; flex-wrap:wrap">
        <div style="display:flex; gap:10px; flex-wrap:wrap">
          <button onclick="markAllNotifySent(${expenseId})">✓ Mark All Sent</button>
          <button onclick="resetNotifySent(${expenseId})">Reset Sent Marks</button>
        </div>
        <button onclick="document.getElementById('notify-modal').remove()">Close</button>
      </div>
    </div>
  </div>`);
  document.body.appendChild(overlay);
  renderNotifyRows(expenseId);
}
function renderNotifyRows(expenseId){
  const e = notifyExpenseCache;
  const rowsBox = document.getElementById('notify-rows-box');
  const progressBox = document.getElementById('notify-progress');
  if(!rowsBox || !e) return;
  let sentCount = 0;
  const rows = notifySoldFlatsCache.map(f=>{
    const key = `expense:${expenseId}:${f.flat_no}`;
    const sent = isWaSent(key);
    if(sent) sentCount++;
    const msg = `Namaste ${f.owner_name||''}, Flat ${f.flat_no} — Society expense update: ${e.category}${e.description?' - '+e.description:''}, ${fmtMoney(e.amount)}, dated ${fmtDate(e.expense_date)}.\n\n- C-Wing Society Maintenance`;
    const link = waLink(f.contact_no, msg);
    const pillId = `notify-pill-${f.flat_no}`;
    return `<div style="display:flex; justify-content:space-between; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--rule); ${sent?'opacity:.55':''}">
      <span>${f.flat_no} — ${f.owner_name||'(no owner)'}</span>
      <span style="display:flex; align-items:center; gap:8px; flex-shrink:0">
        ${link ? `<a href="${link}" target="_blank" class="btn primary" style="text-decoration:none; display:inline-flex; align-items:center" onclick="return handleNotifySend(event,'${key}',${expenseId},'${link}')">${WA_ICON}Send</a>` : `<span class="config-note" style="margin:0">No contact no.</span>`}
        <span id="${pillId}" class="pill ${sent?'sold':'unsold'}" style="cursor:pointer" title="Tap to toggle Sent/Pending (PIN needed)" onclick="toggleNotifySent('${key}',${expenseId})">${sent?'✓ Sent':'Pending'}</span>
      </span>
    </div>`;
  }).join('');
  rowsBox.innerHTML = rows || '<p class="empty">Koi Sold flat with contact number nahi mila.</p>';
  const total = notifySoldFlatsCache.length;
  progressBox.textContent = total ? `${sentCount} / ${total} sent — ${total-sentCount} baaki` : '';
}
function handleNotifySend(event, key, expenseId, link){
  event.preventDefault();
  withPin(async ()=>{
    window.open(link, '_blank');
    await setWaSent(key, true);
    renderNotifyRows(expenseId);
  });
  return false;
}
function toggleNotifySent(key, expenseId){
  withPin(async ()=>{
    await setWaSent(key, !isWaSent(key));
    renderNotifyRows(expenseId);
  });
}
function resetNotifySent(expenseId){
  withPin(async ()=>{
    showConfirmModal('Is expense ke sabhi "Sent" marks clear kar du? (Sirf tracking reset hoga, koi data delete nahi hoga.)', async ()=>{
      for(const f of notifySoldFlatsCache) await setWaSent(`expense:${expenseId}:${f.flat_no}`, false);
      renderNotifyRows(expenseId);
    });
  });
}
function markAllNotifySent(expenseId){
  withPin(async ()=>{
    for(const f of notifySoldFlatsCache) await setWaSent(`expense:${expenseId}:${f.flat_no}`, true);
    renderNotifyRows(expenseId);
  });
}

  });
}

/* ---- Charges tab ---- */
let chargeRoundsCache = [];
let editingChargeRoundName = null;
async function renderChargesTab(box){
  const {data, error} = await sb.from('charges').select('*').order('date_started',{ascending:false});
  chargeRoundsCache = data || [];
  box.innerHTML = `
    <div class="card">
      <h3 id="charges-form-title">Add Charge Round</h3>
      <div class="form-row">
        <div class="field"><label>Round Name</label><input id="ch_name" placeholder="e.g. Diwali Fund"></div>
        <div class="field"><label>Amount per Flat</label><input id="ch_amount" type="number"></div>
        <div class="field"><label>Applies To</label><select id="ch_applies"><option>All Flats</option><option>Sold Flats Only</option><option>Unsold Flats Only</option></select></div>
        <div class="field"><label>Date Started</label><input id="ch_date" type="date"></div>
        <div class="field" style="flex:0"><button class="primary" onclick="addCharge()">Save</button></div>
        <div class="field" style="flex:0"><button onclick="resetChargeForm()">Clear</button></div>
      </div>
      ${error?`<div class="msg error">${error.message}</div>`:''}
      <table><thead><tr><th>Round</th><th>Amount/Flat</th><th>Applies To</th><th>Started</th><th></th></tr></thead><tbody>
      ${(data||[]).map(c=>`<tr>
        <td>${c.round_name}</td><td class="mono">${fmtMoney(c.amount_per_flat)}</td><td>${c.applies_to}</td><td class="mono">${fmtDate(c.date_started)}</td>
        <td style="white-space:nowrap"><button onclick="editCharge('${c.round_name}')">Edit</button> <button class="danger" onclick="deleteRow('charges','round_name','${c.round_name}',true)">Delete</button></td>
      </tr>`).join('') || `<tr><td colspan="5" class="empty">No charge rounds yet.</td></tr>`}
      </tbody></table>
    </div>`;
}
function editCharge(roundName){
  const c = chargeRoundsCache.find(x=>x.round_name===roundName);
  if(!c) return;
  editingChargeRoundName = roundName;
  document.getElementById('ch_name').value = c.round_name;
  document.getElementById('ch_amount').value = c.amount_per_flat ?? '';
  document.getElementById('ch_applies').value = c.applies_to || 'All Flats';
  document.getElementById('ch_date').value = c.date_started || '';
  document.getElementById('charges-form-title').textContent = `Editing "${roundName}"`;
  document.getElementById('ch_name').scrollIntoView({behavior:'smooth', block:'center'});
}
function resetChargeForm(){
  editingChargeRoundName = null;
  ['ch_name','ch_amount','ch_date'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('ch_applies').value = 'All Flats';
  document.getElementById('charges-form-title').textContent = 'Add Charge Round';
}
async function addCharge(){
  await withPin(async ()=>{
    const newName = document.getElementById('ch_name').value;
    const payload = {
      round_name: newName,
      amount_per_flat: Number(document.getElementById('ch_amount').value),
      applies_to: document.getElementById('ch_applies').value,
      date_started: document.getElementById('ch_date').value || null,
    };
    if(editingChargeRoundName && editingChargeRoundName !== newName){
      // Renaming a round: insert the new name first, repoint every collection
      // entry to it, then remove the old name — this order never leaves a
      // collections.purpose value pointing at a round_name that doesn't exist.
      const insertRes = await sb.from('charges').insert(payload);
      if(insertRes.error){ alert(insertRes.error.message); return; }
      const moveRes = await sb.from('collections').update({purpose: newName}).eq('purpose', editingChargeRoundName);
      if(moveRes.error){ alert('Round renamed, lekin collections entries move karte waqt error: ' + moveRes.error.message); return; }
      const deleteRes = await sb.from('charges').delete().eq('round_name', editingChargeRoundName);
      if(deleteRes.error){ alert('Warning: purani round "' + editingChargeRoundName + '" delete nahi ho payi: ' + deleteRes.error.message); }
      editingChargeRoundName = null; refreshTab(); return;
    }
    const {error} = editingChargeRoundName
      ? await sb.from('charges').update(payload).eq('round_name', editingChargeRoundName)
      : await sb.from('charges').insert(payload);
    if(error) alert(error.message); else { editingChargeRoundName = null; refreshTab(); }
  });
}

/* ---- Sticker Log tab ---- */
let vehiclesByFlatCache = [];
let firstIssuedVehicles = new Set();
let lastStickerFlat = null;
async function renderStickerLogTab(box){
  const [{data, error}, {data:flats}, {data:allVehicles}, {data:firstIssued}] = await Promise.all([
    sb.from('sticker_log').select('*').order('log_date',{ascending:false}),
    sb.from('flats').select('flat_no, owner_name').order('flat_no'),
    sb.from('vehicles').select('flat_no, vehicle_number, vehicle_type').order('flat_no'),
    sb.from('sticker_log').select('vehicle_number').eq('reason','First Issue')
  ]);
  vehiclesByFlatCache = allVehicles || [];
  firstIssuedVehicles = new Set((firstIssued||[]).map(r=>(r.vehicle_number||'').toUpperCase()));
  const vehicleTypeFor = (vnum) => {
    const v = vehiclesByFlatCache.find(x => (x.vehicle_number||'').toUpperCase() === (vnum||'').toUpperCase());
    return v ? v.vehicle_type : null;
  };
  // group entries by flat, like the Vehicles tab, so flat/date info isn't repeated per row
  const byFlat = {};
  (data||[]).forEach(s=>{
    if(!byFlat[s.flat_no]) byFlat[s.flat_no] = { flat_no:s.flat_no, entries:[] };
    byFlat[s.flat_no].entries.push(s);
  });
  const groups = Object.values(byFlat).sort((a,b)=>a.flat_no-b.flat_no);
  groups.forEach(g=> g.entries.sort((a,b)=>{
    const ta = vehicleTypeFor(a.vehicle_number) === 'Four Wheeler' ? 0 : 1;
    const tb = vehicleTypeFor(b.vehicle_number) === 'Four Wheeler' ? 0 : 1;
    if(ta !== tb) return ta - tb;
    return b.log_date.localeCompare(a.log_date);
  }));
  box.innerHTML = `
    <div class="card">
      <h3>Add Sticker Log Entry</h3>
      <div class="form-row">
        <div class="field"><label>Date</label><input id="s_date" type="date"></div>
        <div class="field"><label>Flat No</label>
          <select id="s_flat" onchange="onStickerFlatChange()">${(flats||[]).map(f=>`<option value="${f.flat_no}">${f.flat_no}${f.owner_name?' — '+f.owner_name:''}</option>`).join('')}</select>
        </div>
        <div class="field"><label>Vehicle Number</label><select id="s_vnum" onchange="updateReasonOptions()"></select></div>
        <div class="field"><label>Reason</label>
          <select id="s_reason"></select>
        </div>
        <div class="field" style="flex:0"><button class="primary" onclick="addStickerLog()">Add</button></div>
      </div>
      ${error?`<div class="msg error">${error.message}</div>`:''}
      <table><thead><tr><th>Flat</th><th>Entries</th></tr></thead><tbody>
      ${groups.map(g=>`<tr class="floor-${Math.floor(g.flat_no/100)}" style="border-bottom:4px solid var(--maroon);">
        <td class="mono v-input flat-no" style="vertical-align:top">${g.flat_no}</td>
        <td>${g.entries.map(s=>{
          const t = vehicleTypeFor(s.vehicle_number);
          const typeClass = t==='Two Wheeler' ? 'type-two' : t==='Four Wheeler' ? 'type-four' : '';
          return `<div style="margin-bottom:4px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
            ${t ? `<img src="${t==='Two Wheeler'?ICON_BIKE:ICON_CAR}" alt="" style="height:22px; vertical-align:middle;">` : ''}
            <span class="pill" style="background:${flatBadgeColor(g.flat_no)}; color:#fff; border-color:${flatBadgeColor(g.flat_no)}; font-weight:700; padding:4px 12px;">Flat ${g.flat_no}</span>
            <span class="mono v-input">${fmtDate(s.log_date)}</span>
            <span class="mono vnum ${typeClass}">${fmtVehicleNumber(s.vehicle_number)}</span>
            ${(s.reason==='Shared Pass' || (s.reason||'').startsWith('No Separate Sticker'))
              ? `<span class="pill" style="background:#B45309; color:#fff; border-color:#B45309; font-weight:700; font-size:12.5px;">⚠ ${s.reason}</span>`
              : `<span class="v-input">${s.reason||''}</span>`}
            <button class="danger" onclick="deleteRow('sticker_log','id',${s.id})">Delete</button>
          </div>`;
        }).join('')}</td>
      </tr>`).join('') || `<tr><td colspan="2" class="empty">No entries yet.</td></tr>`}
      </tbody></table>
    </div>`;
  if(lastStickerFlat && (flats||[]).some(f=>String(f.flat_no)===String(lastStickerFlat))){
    document.getElementById('s_flat').value = lastStickerFlat;
  }
  onStickerFlatChange();
}
function onStickerFlatChange(){
  const flatSel = document.getElementById('s_flat');
  const vnumSel = document.getElementById('s_vnum');
  if(!flatSel || !vnumSel) return;
  const flatNo = Number(flatSel.value);
  const matches = vehiclesByFlatCache.filter(v => v.flat_no === flatNo);
  vnumSel.innerHTML = matches.length
    ? matches.map(v=>`<option value="${v.vehicle_number}">${fmtVehicleNumber(v.vehicle_number)} — ${v.vehicle_type==='Two Wheeler'?'2-Wheeler':'4-Wheeler'}</option>`).join('')
    : `<option value="">No vehicle on record for this flat</option>`;
  updateReasonOptions();
}
function updateReasonOptions(){
  const vnumSel = document.getElementById('s_vnum');
  const reasonSel = document.getElementById('s_reason');
  if(!vnumSel || !reasonSel) return;
  const selectedVnum = (vnumSel.value||'').toUpperCase();
  const alreadyIssued = selectedVnum && firstIssuedVehicles.has(selectedVnum);
  const options = [];
  if(!alreadyIssued) options.push('First Issue');
  options.push('Replacement - Lost', 'Replacement - Damaged', 'Shared Pass', 'No Separate Sticker (Owns 2 Four Wheeler)', 'Other');
  reasonSel.innerHTML = options.map(o=>`<option>${o}</option>`).join('');
}
async function addStickerLog(){
  const vehicleNumber = document.getElementById('s_vnum').value.toUpperCase().trim();
  const reason = document.getElementById('s_reason').value || null;
  if(reason === 'First Issue' && firstIssuedVehicles.has(vehicleNumber)){
    alert('This vehicle already has a First Issue sticker on record. Pick a Replacement reason instead.');
    return;
  }
  await withPin(async ()=>{
    lastStickerFlat = document.getElementById('s_flat').value;
    const payload = {
      log_date: document.getElementById('s_date').value || new Date().toISOString().slice(0,10),
      flat_no: Number(document.getElementById('s_flat').value),
      vehicle_number: vehicleNumber,
      reason: reason,
    };
    const {error} = await sb.from('sticker_log').insert(payload);
    if(error) alert(error.message); else refreshTab();
  });
}

/* ---- Dues Summary tab (pivot: flat x charge round, with total) ---- */
async function renderDuesTab(box){
  const [{data:rounds, error:e1}, {data:rows, error:e2}] = await Promise.all([
    sb.from('charges').select('round_name').order('round_name'),
    sb.from('v_dues_summary').select('*')
  ]);
  const roundNames = (rounds||[]).map(r=>r.round_name);
  const byFlat = {};
  (rows||[]).forEach(r=>{
    if(!byFlat[r.flat_no]) byFlat[r.flat_no] = { owner_name:r.owner_name, status:r.status, perRound:{}, total:0 };
    byFlat[r.flat_no].perRound[r.round_name] = r.pending_amount;
    byFlat[r.flat_no].total += Number(r.pending_amount||0);
  });
  const flatNos = Object.keys(byFlat).map(Number).sort((a,b)=>a-b);
  box.innerHTML = `
    <div class="card">
      <h3>Dues Summary</h3>
      <p class="config-note">Adding a new round in the "Charges" tab automatically adds a column here and folds it into each flat's total — nothing else to configure.</p>
      ${e1||e2?`<div class="msg error">${(e1||e2).message}</div>`:''}
      <table><thead><tr>
        <th>Flat</th><th>Owner</th>
        ${roundNames.map(r=>`<th>${r}</th>`).join('')}
        <th>Total Pending</th>
      </tr></thead><tbody>
      ${flatNos.map(fn=>{
        const f = byFlat[fn];
        return `<tr class="floor-${Math.floor(fn/100)}">
          <td class="mono v-input flat-no">${fn}</td><td class="v-input owner-name">${f.owner_name||''}</td>
          ${roundNames.map(r=>`<td class="mono v-formula">${fmtMoney(f.perRound[r]||0)}</td>`).join('')}
          <td class="mono v-formula" style="font-weight:600">${fmtMoney(f.total)}</td>
        </tr>`;
      }).join('') || `<tr><td colspan="${2+roundNames.length+1}" class="empty">No charge rounds set up yet — add one in the Charges tab.</td></tr>`}
      </tbody></table>
    </div>`;
}

/* ---- generic delete (with a proper styled confirm popup) ---- */
function showConfirmModal(message, onYes){
  const old = document.getElementById('confirm-modal');
  if(old) old.remove();
  const overlay = el(`<div class="modal-backdrop" id="confirm-modal">
    <div class="modal-box">
      <h3>Are you sure?</h3>
      <p>${message}</p>
      <div class="modal-actions">
        <button onclick="document.getElementById('confirm-modal').remove()">Cancel</button>
        <button class="danger" id="confirm-modal-yes">Yes, delete</button>
      </div>
    </div>
  </div>`);
  document.body.appendChild(overlay);
  document.getElementById('confirm-modal-yes').onclick = async ()=>{
    overlay.remove();
    await onYes();
  };
}
async function deleteRow(table, col, val, isString){
  await withPin(async ()=>{
    showConfirmModal('This will permanently delete this row. This cannot be undone.', async ()=>{
      const {error} = await sb.from(table).delete().eq(col, val);
      if(error) alert(error.message); else refreshTab();
    });
  });
}

/* ---------------- boot ---------------- */
(async ()=>{
  if(pinStillValid()){
    const {data:{session}} = await sb.auth.getSession();
    if(session){ state.user = session.user; }
    else { localStorage.removeItem(PIN_UNLOCK_KEY); } // stale flag, session actually gone
  }
  render();
})();
</script>
